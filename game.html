<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>福丸の術稽古 ｜ 神宿りの傀儡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;height:100%;background:#0b0c14;color:#ece3cf;font-family:"DotGothic16",monospace;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  #bar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0;font-size:13px}
  #bar a,#bar button{color:#c9a35a;text-decoration:none;background:none;border:1px solid rgba(201,163,90,.4);
    font:inherit;padding:4px 10px;cursor:pointer}
  #stage{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000;
    box-shadow:0 0 0 2px #2a2216,0 0 0 4px #c9a35a33,0 10px 40px rgba(0,0,0,.6)}
  #pad{width:100%;max-width:560px;display:none;justify-content:space-between;align-items:center;padding:6px 14px 22px}
  .touch #pad{display:flex}
  .dir,.act{display:flex;gap:10px;align-items:center}
  .btn{width:62px;height:62px;border-radius:50%;border:2px solid #c9a35a88;background:#1a1a28;color:#ece3cf;
    display:grid;place-items:center;font:inherit;font-size:18px;touch-action:none}
  .btn.down{width:54px;height:54px;font-size:15px;transform:translateY(18px)}
  .btn.on{background:#c9a35a;color:#14121c}
  .btn.a{background:#6b2620;border-color:#e0705f}
  .btn.b{background:#203a6b;border-color:#7fa8e8;font-size:15px}
  .btn.a.on{background:#e0705f}.btn.b.on{background:#7fa8e8}
  .act .btn.a{transform:translateY(-14px)}
  @media (orientation:landscape) and (max-height:520px){
    .touch #pad{position:fixed;left:0;right:0;bottom:0;max-width:none;padding:0 16px 14px;pointer-events:none}
    .touch #pad .btn{pointer-events:auto;opacity:.75}
    #bar{position:fixed;top:0;z-index:2;align-items:flex-start;pointer-events:none}
    #bar a,#bar button{pointer-events:auto}
    #bar span{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
    #bar span button{margin:0}
  }
  #pause{margin-right:6px}
  /* スライド操作：指を置いた所が中心。すべらせた向きに動く／上でジャンプ／下でしゃがむ／トンと叩くと湯鉄砲 */
  #pad2{display:none;width:100%;padding:4px 14px 18px;justify-content:flex-end}
  .touch.slide #pad{display:none}
  .touch.slide #pad2{display:flex}
  .touch.slide.lefty #pad2{justify-content:flex-start}
  #zone2{position:relative;width:min(70vw,300px);height:210px;border-radius:22px;border:2px dashed #c9a35a55;background:rgba(26,26,40,.6);touch-action:none;overflow:hidden}
  #zone2 .hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8f8672;font-size:13px;line-height:1.7;pointer-events:none}
  #zone2.act .hint{display:none}
  #ring2,#knob2{position:absolute;border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%)}
  #ring2{width:110px;height:110px;border:2px solid #c9a35a88}
  #knob2{width:46px;height:46px;background:#c9a35a;opacity:.85}
  #zone2.act #ring2,#zone2.act #knob2{display:block}
  @media (orientation:landscape) and (max-height:520px){
    .touch.slide #pad2{position:fixed;left:0;right:0;bottom:0;padding:0 14px 8px;pointer-events:none}
    .touch.slide #zone2{pointer-events:auto}
    #zone2{height:170px;width:230px}
  }
  #hand{display:none}
  .touch #bar{font-size:12px;gap:4px}
  .touch #bar a,.touch #bar button{padding:4px 7px}
  .touch #bar span{white-space:nowrap}
  .touch #hand{display:inline-block}
  @media (orientation:landscape) and (max-height:520px){
  }
  #help{font-size:12px;color:#8f8672;text-align:center;padding-bottom:10px}
  .touch #help{display:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <a href="index.html">← 公式サイトへ</a>
    <span><button id="hand" type="button">両手</button>
    <button id="pause" type="button" hidden>⏸ 一時停止</button>
    <button id="mute" type="button">♪ 音：オン</button></span>
  </div>
  <div id="stage"><canvas id="cv" width="384" height="336"></canvas></div>
  <div id="pad">
    <div class="dir">
      <button class="btn" data-k="left" type="button">◀</button>
      <button class="btn down" data-k="down" type="button">▼</button>
      <button class="btn" data-k="right" type="button">▶</button>
    </div>
    <div class="act">
      <button class="btn b" data-k="b" type="button">湯</button>
      <button class="btn a" data-k="a" type="button">跳</button>
    </div>
  </div>
  <div id="pad2"><div id="zone2"><div class="hint">ここに指を置いてすべらせる<br>←→ 移動　↑ ジャンプ　↓ しゃがむ<br>トンと叩く 湯鉄砲／止めて長押し 大技</div><div id="ring2"></div><div id="knob2"></div></div></div>
  <p id="help">←→ 移動　↓ しゃがむ　Z/スペース ジャンプ・会話送り　X 湯鉄砲・会話スキップ（札5枚でX長押し→離すと大技）　P/Esc 一時停止</p>
</div>

    if (!Object.prototype.hasOwnProperty.call(poses, pose)) throw new RangeError("不明なポーズです。");
    drawRows(ctx, poses[pose], x, y, scale);
  }

  function drawRows(ctx, rows, x, y, scale) {
    if (!Number.isInteger(x) || !Number.isInteger(y) || !Number.isInteger(scale) || scale < 1) {
      throw new RangeError("x・yは整数、scaleは1以上の整数で指定してください。");
    }
    const height = rows.length, width = rows[0].length;
    const oldFill = ctx.fillStyle;
    try {
      for (let row = 0; row < height; row++) {
        const line = rows[row];
        let start = 0;
        while (start < width) {
          const color = line[start];
          let end = start + 1;
          while (end < width && line[end] === color) end++;
          if (color !== ".") {
            ctx.fillStyle = palette[color];
            ctx.fillRect(x + start * scale, y + row * scale, (end - start) * scale, scale);
          }
          start = end;
        }
      }
    } finally {
      ctx.fillStyle = oldFill;
    }
  }
  const mudRows = Object.freeze([
    "...kkk...",
    ".kkcogkk.",
    "kbcohocck",
    "kbcooccok",
    "kpbbcbbbk",
    ".kppbbpk.",
    "..kkkkk.."
  ]);
  const releaseMs = {};
  for (const action of ["spit", "spitFirst"]) {
    let elapsed = 0;
    for (const [pose, duration] of clips[action]) {
      if (pose === "spitRelease") break;
      elapsed += duration;
    }
    releaseMs[action] = elapsed;
  }
  // 本体左上を原点とする発射位置。速度は等倍のドット数／秒。
  const mudShot = Object.freeze({
    width: mudRows[0].length, height: mudRows.length, rows: mudRows,
    originX: 16, originY: 31, speed: 100, releaseMs: Object.freeze(releaseMs)
  });
  function mudShotAt(action, elapsedMs) {
    if (!Number.isFinite(elapsedMs)) throw new RangeError("経過時間には有限の数値を指定してください。");
    const release = mudShot.releaseMs[action];
    if (typeof release !== "number" || elapsedMs < release) return null;
    return {x: mudShot.originX - Math.floor((elapsedMs - release) * mudShot.speed / 1000), y: mudShot.originY};
  }
  function drawMudShot(ctx, x = 0, y = 0, scale = 1) {
    drawRows(ctx, mudRows, x, y, scale);
  }
  globalThis.Dorotabo = Object.freeze({
    width, height, palette, poses, durations, frameAt, draw, mudShot, mudShotAt, drawMudShot
  });
})();

  };

  const duration = Object.freeze(Object.fromEntries(Object.entries(clips).map(
    ([key, frames]) => [key,frames.reduce((total, [,ms]) => total+ms,0)]
  )));
  function frameAt(action, ms) {
    if (!Number.isFinite(ms)) throw new TypeError("経過時間にはミリ秒を指定してください。");
    if (action === "idle") return "idle";
    if (!Object.hasOwn(clips,action)) throw new RangeError("攻撃名は plane または nail です。");

    for (const [pose,length] of clips[action]) {
      if (t < length) return pose;
      t -= length;
    }
    return "idle";
  }
  function sample(action, ms) {
    const pose = frameAt(action,ms);
    const elapsed = ms-releaseMs[action];
    let projectile = null;

        projectile = {sprite:"curl"+(Math.floor(elapsed/85)%4),x:17-Math.floor(elapsed*.122),y:113};

        const travel = elapsed*.172;

// 登場順に描く（後ろ→手前）。cx は中心、最初からいる人は cast に
const PORTRAIT_POS = {'灯真': {key: 'toma', cx: 246}, '椿': {key: 'tsubaki', cx: 326}, '宝条吉利': {key: 'kiri', cx: 200}, '福丸': {key: 'fk_fight', cx: 70}};
const PORTRAIT_ORDER = ['灯真', '椿', '宝条吉利', '福丸'];
function talkCast(lines){
  return lines.cast || ['福丸', '灯真', '椿'];
}
function drawPortraits(){
  if (talk.lineI !== talk.i || talk.lineL !== talk.lines){ talk.lineI = talk.i; talk.lineL = talk.lines; talk.lineT = frame; }
  const cast = new Set(talkCast(talk.lines));
  let face = 'fk_fight';
  for (let i = 0; i <= talk.i; i++){
    const L = talk.lines[i];
    if (PORTRAIT_POS[L[0]]) cast.add(L[0]);
    if (L[0] === '福丸' && L[2]) face = L[2];
  }
  const speaker = talk.lines[talk.i][0];
  // セリフ枠の左右の幅からはみ出さないよう切り取って描く
  ctx.save(); ctx.beginPath(); ctx.rect(9, 0, 366, H); ctx.clip();
  for (const who of PORTRAIT_ORDER){
    if (!cast.has(who)) continue;
    // セリフの後で退場する人（exit：この行より後は出さない）
    let fade = 1;
    if (talk.lines.exit && talk.lines.exit[who] !== undefined && talk.i > talk.lines.exit[who]){
      // 次の行に移ってから約0.5秒かけて、すっと薄くなって消える
      if (talk.i > talk.lines.exit[who] + 1) continue;
      fade = 1 - (frame - talk.lineT) / 30;
      if (fade <= 0) continue;
    }
    const key = who === '福丸' ? face : PORTRAIT_POS[who].key;
    const on = who === speaker;
    const img = on ? PIMG[key] : PDIM[key];
    if (!img) continue;
    const pcx = (talk.lines.pos && talk.lines.pos[who]) || PORTRAIT_POS[who].cx;
    const x = Math.round(pcx - img.width / 2);
    const y = 240 - img.height - (on ? 3 : 0);
    ctx.globalAlpha = fade; ctx.drawImage(img, x, y); ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ---------- 当たり判定・移動 ---------- */
function overlap(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
// ドット単位の当たり判定（透明は除く。ignoreは当たらない色）
function pixelHit(ra, ax, ay, rb, bx, by, ignore = ''){
  ax = Math.round(ax); ay = Math.round(ay); bx = Math.round(bx); by = Math.round(by);
  const l = Math.max(ax, bx), t = Math.max(ay, by), r = Math.min(ax + ra[0].length, bx + rb[0].length), b = Math.min(ay + ra.length, by + rb.length);
  for (let y = t; y < b; y++) for (let x = l; x < r; x++)
    if (ra[y - ay][x - ax] !== '.' && rb[y - by][x - bx] !== '.' && !ignore.includes(rb[y - by][x - bx])) return true;
  return false;
}
function moveBody(o, oneWay = true){
  o.x += o.vx;
  let hitWall = false;
  const t0 = Math.floor(o.y / TS), t1 = Math.floor((o.y + o.h - 1) / TS);
  if (o.vx > 0){ const tx = Math.floor((o.x + o.w - 1) / TS); for (let ty = t0; ty <= t1; ty++) if (isSolid(tileAt(tx, ty))){ o.x = tx * TS - o.w; o.vx = 0; hitWall = true; break; } }
  if (o.vx < 0){ const tx = Math.floor(o.x / TS); for (let ty = t0; ty <= t1; ty++) if (isSolid(tileAt(tx, ty))){ o.x = (tx + 1) * TS; o.vx = 0; hitWall = true; break; } }
  const prevBottom = o.y + o.h;
  o.y += o.vy; o.ground = false;
  const l0 = Math.floor(o.x / TS), l1 = Math.floor((o.x + o.w - 1) / TS);
  if (o.vy > 0){
    // 足の裏（y+h）が少しでもタイルに入ったら着地
    const ty = Math.floor((o.y + o.h) / TS);
    for (let tx = l0; tx <= l1; tx++){
      const ch = tileAt(tx, ty);
      if (isSolid(ch) || (oneWay && ch === '=' && prevBottom <= ty * TS + 1)){ o.y = ty * TS - o.h; o.vy = 0; o.ground = true; break; }
    }
  } else if (o.vy < 0){
    const ty = Math.floor(o.y / TS);
    for (let tx = l0; tx <= l1; tx++) if (isSolid(tileAt(tx, ty))){ o.y = (ty + 1) * TS; o.vy = 0; break; }
  }
  return hitWall;
}
function burst(x, y, n, colors, sp = 2.2, up = 1.5){
  for (let i = 0; i < n; i++){ const a = Math.random() * Math.PI * 2, s = Math.random() * sp;
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - up, life: 20 + (Math.random() * 20 | 0), col: colors[(Math.random() * colors.length) | 0], g: .08, size: 1 + (Math.random() < .4 ? 1 : 0)}); }
}
function steam(x, y, n){
  for (let i = 0; i < n; i++) parts.push({x: x + (Math.random() - .5) * 15, y, vx: (Math.random() - .5) * .7, vy: -.6 - Math.random() * .9, life: 30 + (Math.random() * 20 | 0), col: Math.random() < .5 ? '#e8e4d8' : '#b8b4a8', g: -.008, size: 3});
}
function hurtPlayer(fromX){
  if (P.inv > 0) return;
  P.hp--; P.inv = 90; P.vy = -3.9; P.vx = (P.x + P.w / 2 < fromX ? -2.4 : 2.4); P.crouch = false; shake = 6; Sound.hurt();

}
/* ---------- 一時停止 ---------- */
let pauseSel = 0, pauseMusic = false;
const pauseBtn = document.getElementById('pause');
function pauseGame(){ if (scene !== 'play') return; scene = 'pause'; pauseSel = 0; pauseMusic = Sound.hold(); Sound.item(); clearPressed(); }
function resumeGame(){ scene = 'play'; if (pauseMusic) Sound.resume(); for (const k in key) key[k] = false; clearPressed(); }
pauseBtn.addEventListener('click', e => { e.currentTarget.blur(); Sound.unlock(); if (scene === 'play') pauseGame(); else if (scene === 'pause') resumeGame(); });
function gameOver(){ scene = 'over'; Sound.stop(); overT = 0; overSel = 0; }

/* 福丸の今の絵の名前と、描く左上の座標 */
const FP_L = Object.fromEntries(Object.entries(FP).map(([k, r]) => [k, r.map(l => [...l].reverse().join(''))]));
function playerPose(){
  if (P.inv > 60) return 'hurt';
  if (P.crouch) return 'crouch';
  if (P.shootT > 0) return 'attack';
  if (!P.ground) return 'run';
  if (Math.abs(P.vx) > .3) return 'run';
  return 'side';
}
// いまのポーズの何コマ目か（空中は走りの足を伸ばしたコマで止める）
function playerFrame(pose){
  if (pose === 'run' && !P.ground && P.inv <= 60 && !P.crouch && P.shootT <= 0) return P.vy < 0 ? 4 : 0;
  return clipFrame(pose, P.poseName === pose ? P.poseT : 0);
}
function playerRows(pose){ const i = playerFrame(pose); return P.face > 0 ? FPF[pose][i] : FPF_L[pose][i]; }
// ポーズが変わったら、そのポーズのアニメーションを最初から
function tickPose(){
  const pose = playerPose();
  if (pose !== P.poseName){ P.poseName = pose; P.poseT = 0; } else P.poseT += FRAME_MS;
}
function playerDrawPos(pose){
  const sh = FK_SHIFT[pose] || 0;
  // 右向きの絵：足元（40ドット目）を当たり判定の下端に、体の中心を判定の中心に
  const x = P.face > 0 ? Math.round(P.x) - 7 - sh : Math.round(P.x) + P.w - 19 + sh;
  return {x, y: Math.round(P.y + P.h) - 40};
}

/* ---------- 更新 ---------- */
function update(){
  frame++;
  if (scene === 'title'){
    titleT++;
    if (pressed.a || pressed.b){ Sound.unlock(); scene = 'select'; selT = 0; selIdx = SAVE.cleared.includes(1) ? 1 : 0; Sound.item(); }
  }
  else if (scene === 'select'){
    selT++;
    if (pressed.left || pressed.right || pressed.down){ selIdx = (selIdx + 1) % STAGES.length; Sound.talk(); }
    stageNo = selIdx + 1;
    if (selT > 10 && pressed.a){
      if (!stageOpen(stageNo)){ Sound.clang(); lockMsgT = 90; }
      else { startGame(false); startTalk(T().intro, () => { scene = 'play'; Sound.bgm(STAGE_BGM()); }); }
    }
    if (lockMsgT > 0) lockMsgT--;
    if (selT > 10 && pressed.b){ scene = 'title'; titleT = 0; stageNo = 1; }
  }
  else if (scene === 'talk'){
    const line = talk.lines[talk.i][1];
    if (pressed.b || skipTap){ skipTap = false; const f = talkNext; talk = null; f(); clearPressed(); return; }
    if (talk.chars < line.length){ talk.chars += .5; if (frame % 4 === 0) Sound.talk(); }
    if (pressed.a){
      if (talk.chars < line.length) talk.chars = line.length;
      else { talk.i++; talk.chars = 0; if (talk.i >= talk.lines.length){ const f = talkNext; talk = null; f(); } }
    }
    updateParts();
  }
  else if (scene === 'play'){ if (pressed.pause){ pauseGame(); return; } updatePlay(); }
  else if (scene === 'pause'){
    if (pressed.left || pressed.right || pressed.down){ pauseSel = 1 - pauseSel; Sound.talk(); }
    if (pressed.pause || pressed.b){ resumeGame(); }
    else if (pressed.a){
      if (pauseSel === 0) resumeGame();
      else { Sound.stop(); scene = 'title'; titleT = 0; stageNo = 1; }
    }
  }
  else if (scene === 'over'){
    overT++;
    if (overT > 40){
      if (pressed.left){ overSel = 0; Sound.talk(); }
      if (pressed.right){ overSel = 1; Sound.talk(); }
      if (pressed.a || pressed.b){
        if (overSel === 0){ startGame(bossReached); if (bossReached) enterBoss(true); else { scene = 'play'; Sound.bgm(STAGE_BGM()); } }
        else { scene = 'thanks'; thanksKind = 'quit'; thanksT = 0; }
      }
    }
  }
  else if (scene === 'result'){
    resultT++; updateParts();
    if (resultT > 60 && (pressed.a || pressed.b)){ scene = 'thanks'; thanksKind = 'clear'; thanksT = 0; }
  }
  else if (scene === 'thanks'){
    thanksT++;
    if (thanksT > 60 && (pressed.a || pressed.b)){ scene = 'title'; titleT = 0; stageNo = 1; }
  }
  clearPressed();
}
function clearPressed(){ for (const k in pressed) pressed[k] = false; }

function updatePlay(){
  timer++;
  // --- 福丸 ---
  P.crouch = key.down && P.ground && P.inv <= 60;
  const acc = P.ground ? .42 : .27, max = 2.55;
  if (P.crouch){ P.vx *= .6; if (Math.abs(P.vx) < .05) P.vx = 0; }
  else if (key.left && !key.right){ P.vx = Math.max(P.vx - acc, -max); P.face = -1; }
  else if (key.right && !key.left){ P.vx = Math.min(P.vx + acc, max); P.face = 1; }
  else { P.vx *= P.ground ? .7 : .92; if (Math.abs(P.vx) < .05) P.vx = 0; }
  if (P.ground) P.coyote = 6; else if (P.coyote > 0) P.coyote--;
  if (pressed.a) P.jumpBuf = 6; else if (P.jumpBuf > 0) P.jumpBuf--;
  if (P.jumpBuf > 0 && P.coyote > 0 && !P.crouch){ P.vy = -7.5; P.coyote = 0; P.jumpBuf = 0; Sound.jump(); }
  if (!key.a && P.vy < -2.4) P.vy = -2.4;
  P.vy = Math.min(P.vy + .36, 7.5);
  moveBody(P);
  // ベルトコンベアの上では流される
  if (P.ground){
    const under = tileAt(Math.floor((P.x + P.w / 2) / TS), Math.floor((P.y + P.h + 1) / TS));
    if (under === 'C' || under === 'c'){ const sv = P.vx; P.vx = under === 'C' ? -1.05 : 1.05; P.vy = 0; moveBody(P); P.vx = sv; P.ground = true; }
  }
  if (P.ground && isSolid(tileAt(Math.floor((P.x + 7) / TS), Math.floor((P.y + P.h + 2) / TS))) && P.inv < 60){ P.safeX = P.x; P.safeY = P.y; }
  if (lockCam) P.x = Math.max(BOSS_COL * TS, Math.min(P.x, (COLS - 1) * TS - P.w));
  if (P.y > H + 30){
    P.hp--; shake = 4; Sound.hurt();
    if (P.hp <= 0){ gameOver(); return; }
    P.x = P.safeX; P.y = P.safeY - 6; P.vx = P.vy = 0; P.inv = 90;
  }
  if (P.inv > 0) P.inv--;
  P.anim += Math.abs(P.vx) > .3 && P.ground ? Math.abs(P.vx) * .09 : 0;
  // 湯鉄砲（しゃがみ中は撃てない）
  if (P.cool > 0) P.cool--;
  if (P.shootT > 0) P.shootT--;
  if (pressed.b && P.cool === 0 && shots.length < 3 && !P.crouch && P.inv <= 60){
    P.shootT = 22; P.poseName = 'attack'; P.poseT = 110;
    const d = playerDrawPos('attack');
    const sx = P.face > 0 ? d.x + 23 : d.x + 26 - 23 - 9;
    shots.push({x: sx, y: d.y + 20, w: 9, h: 4, vx: 4.6 * P.face, vy: 0, life: 70});
    P.cool = 14; Sound.shot();
  }
  // --- 溜め：湯を押し続けると溜まり、離すと大技（札5枚） ---
  if (key.b && !P.crouch && P.inv <= 60){
    P.chargeT = (P.chargeT || 0) + 1;
    if (fudaStock < BIG_COST && P.chargeT === CHARGE_FULL){ popText(P.x - 30, P.y - 22, '札が5枚いるよ'); }
    if (fudaStock >= BIG_COST && P.chargeT === CHARGE_FULL){ Sound.item(); burst(P.x + 7, P.y + 18, 10, ['#fff6c0', '#ffd36a']); }
  } else {
    if (P.chargeT >= CHARGE_FULL && fudaStock >= BIG_COST && !P.crouch && P.inv <= 60){
      fudaStock -= BIG_COST;
      const d = playerDrawPos('attack');
      const sx = P.face > 0 ? d.x + 20 : d.x + 6 - 28;
      shots.push({x: sx, y: d.y + 12, w: 28, h: 18, vx: 4.2 * P.face, vy: 0, life: 140, big: true, rows: P.face > 0 ? BIGW : BIGW_L});
      P.shootT = 22; P.poseName = 'attack'; P.poseT = 110; P.cool = 20;
      shake = 8; Sound.roar(); Sound.shot();
      burst(P.x + 7 + P.face * 16, P.y + 16, 16, ['#ffffff', '#c1faff', '#4bc6eb', '#ffd36a']);
      popText(P.x - 22, P.y - 24, '破魔の大湯玉！');
    }
    P.chargeT = 0;
  }
  tickPose();
  // --- 弾 ---
  for (const s of shots){
    s.x += s.vx; s.life--;
    if (frame % 3 === 0) parts.push({x: s.x + 4, y: s.y, vx: 0, vy: -.4, life: 14, col: '#f0f0ff', g: -.01});
    const ch = tileAt(Math.floor((s.x + (s.vx > 0 ? 8 : 0)) / TS), Math.floor((s.y + 2) / TS));
    if (isSolid(ch) || s.life <= 0){ s.dead = true; splash(s); }
  }
  // --- 敵 ---
  for (const e of enemies){
    e.anim++;
    if (e.dead){ e.dead++; continue; }
    if (e.flash > 0) e.flash--;
    if (e.type === 'doro' || e.type === 'server' || e.type === 'porter'){
      if (e.still){ e.vy = 0; }
      else if (Math.abs(e.x - P.x) < 450){
        const wall = moveBody(e);
        e.vy = Math.min(e.vy + .3, 6);
        if (e.ground){
          if (e.vx === 0) e.vx = e.dir || ({server: -.5, porter: -.4}[e.type] || -.55);
          const ahead = Math.floor((e.x + (e.vx > 0 ? e.w + 1 : -1)) / TS), below = Math.floor((e.y + e.h + 2) / TS);
          const t = tileAt(ahead, below);
          if (wall || !(isSolid(t) || t === '=')) e.vx = -(e.dir || e.vx || -.55);
          e.dir = e.vx;
        }
        if (e.y > H + 60) e.gone = true;
      }
    } else if (e.type === 'onibi' || e.type === 'hebi'){
      const dx = P.x - e.x;
      if (Math.abs(dx) < 180){ e.x += Math.sign(dx) * (e.type === 'hebi' ? .6 : .5); if (dx) e.face = Math.sign(dx); }
      e.y = e.by + Math.sin(e.anim / 20) * (e.type === 'hebi' ? 12 : 15);
    }
    if (overlap(P, e)) hurtPlayer(e.x + e.w / 2);
    // 敵の当たり判定は絵の頭の先まで広げる
    const hb = {x: e.x - 1, y: e.y - 5, w: e.w + 2, h: e.h + 5};
    for (const s of shots) if (!s.dead && overlap(s, hb)){
      if (s.big) e.hp = 0; else { s.dead = true; e.hp--; } e.flash = 8; Sound.hit(); burst(s.x, s.y, 5, ['#9fd8ff', '#fff']);
      if (e.hp <= 0){
        e.dead = 1; score += e.type === 'porter' ? 400 : (e.type === 'doro' || e.type === 'server') ? 200 : 300; Sound.kill(); steam(e.x + e.w / 2, e.y + e.h, 12);
        const cols = {doro: ['#84513c', '#bd8040', '#341717'], server: ['#2a1840', '#5a3c82', '#d89549', '#fff4df'], porter: ['#2a1840', '#5a3c82', '#d89549', '#915438'], hebi: ['#2a1840', '#5a3c82', '#0e0818']}[e.type] || ['#7fd8ff', '#e8fbff'];
        burst(e.x + e.w / 2, e.y + e.h / 2, 12, cols);
        if (e.type === 'server' || e.type === 'porter') snakeOut(e.x + e.w / 2, e.y + 4, 6);
      }
    }
  }
  enemies = enemies.filter(e => !(e.dead > 24) && !e.gone);
  // --- 荷運び人形が丸太を落とす ---
  for (const e of enemies){
    if (e.type !== 'porter' || e.dead || !e.carry || !e.drops) continue;
    const dir = e.vx > 0 ? 1 : -1, dx = (P.x + P.w / 2) - (e.x + e.w / 2);
    if (Math.sign(dx) === dir && Math.abs(dx) < 150 && Math.abs(P.y - e.y) < 80){
      e.carry = false; Sound.clang();
      logs.push({x: e.x + e.w / 2 - 6 + dir * 4, y: e.y + 6, w: 13, h: 12, vx: dir * 1.2, vy: -1, ground: false, t: 0});
    }
  }
  for (const L of logs){
    L.t++;
    L.vy = Math.min(L.vy + .3, 6);

function drawMap(cx){

function drawAura(cx){
  const k = Math.min(1, (P.chargeT - CHARGE_SHOW) / (CHARGE_FULL - CHARGE_SHOW)), full = P.chargeT >= CHARGE_FULL, ok = fudaStock >= BIG_COST;
  const ax = Math.round(P.x + P.w / 2 - cx), foot = Math.round(P.y + P.h), f = frame;
  // 外側・内側の2層。外は大きく淡く、内は小さく明るく
  const layers = ok
    ? [{c: full && (f >> 2) % 2 ? '255,250,230' : '255,150,60', a: .22 + k * .18, r: 1.0},
       {c: '255,214,106', a: .26 + k * .2, r: .72},
       {c: '255,250,220', a: full ? .45 : .2 + k * .15, r: .42}]
    : [{c: '120,170,255', a: .14 + k * .1, r: 1.0}, {c: '200,225,255', a: .16, r: .6}];

      let w = baseW * L.r * (t < .55 ? 1 - (t - .3) ** 2 * .8 : Math.max(0, 1 - (t - .55) * 2.1));

      const wr = Math.sin(yy * .38 - f * .29 + 2) * (1.5 + t * 3) + Math.sin(yy * .8 + f * .25) * 1;
      const x0 = Math.round(ax - w + wl), x1 = Math.round(ax + w + wr);
      if (x1 > x0) ctx.fillRect(x0, foot - yy, x1 - x0, 1);
    }
    // 炎の舌：先が揺れながら伸び縮みする
    for (let n = 0; n < 4; n++){
      const ox = (n - 1.5) * 5 * L.r * (1 + k * .4);
      const th = (8 + k * 12) * L.r * (.6 + .4 * Math.abs(Math.sin(f * .23 + n * 1.9)));
      const top = foot - height * L.r * .78;
      for (let yy = 0; yy < th; yy++){
        const w = Math.max(0, (1 - yy / th) * 3 * L.r + .5);
        const sway = Math.sin(yy * .5 + f * .4 + n) * (yy / th) * 3;
        ctx.fillRect(Math.round(ax + ox - w + sway), Math.round(top - yy), Math.max(1, Math.round(w * 2)), 1);
      }
    }
  }
  ctx.restore();

  if (frame % (full ? 2 : 4) === 0){
    const a = (Math.random() - .5) * baseW * 2;
    parts.push({x: P.x + P.w / 2 + a, y: P.y + P.h - 8 - Math.random() * 20, vx: (Math.random() - .5) * .4, vy: -1 - k * 1.2 - Math.random(), life: 16 + (Math.random() * 10 | 0),
      col: !ok ? '#bcd6ff' : Math.random() < .3 ? '#ffffff' : Math.random() < .6 ? '#ffd36a' : '#ff8a3c', g: -.01, size: full && Math.random() < .5 ? 2 : 1});
  }
}

function draw(){
  ctx.imageSmoothingEnabled = false;
  const pb = !(scene === 'play' || scene === 'pause'), pt = scene === 'pause' ? '▶ つづける' : '⏸ 一時停止';
  if (pauseBtn.hidden !== pb) pauseBtn.hidden = pb;
  if (pauseBtn.textContent !== pt) pauseBtn.textContent = pt;
  if (scene === 'loading'){ ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); drawText('よみこみ中…', 192, 156, '#ece3cf', 16, 'center', false); return; }
  if (scene === 'title'){ drawTitle(); return; }
  if (scene === 'select'){ drawSelect(); return; }
  if (scene === 'result'){ drawResult(); return; }
  if (scene === 'thanks'){ drawThanks(); return; }
  drawWorld(); drawHUD();
  if (scene === 'talk') drawTalk();
  if (scene === 'over') drawOver();
  if (scene === 'pause') drawPause();
}
function drawPause(){
  ctx.fillStyle = 'rgba(6,6,18,.62)'; ctx.fillRect(0, 0, W, H);
  drawWindow(92, 96, 200, 132);
  drawText('一時停止中', 192, 110, '#ffd36a', 22, 'center');
  ['つづける', 'タイトルにもどる'].forEach((t, i) => {
    const y = 156 + i * 30, sel = pauseSel === i;
    drawText(t, 192, y, sel ? '#f4eee0' : '#8f8672', 18, 'center');
    if (sel && (frame >> 4) % 2 === 0) drawText('▶', 110, y, '#ffd36a', 18);
  });
  drawText(isTouch ? 'タップで選んで決定' : 'P・Esc でもどる', 192, 244, '#ece3cf', 12, 'center');
}

/* ---------- ループ ---------- */
let last = 0, accT = 0;
function loop(t){
  if (!last) last = t;
  accT += Math.min(100, t - last); last = t;
  requestAnimationFrame(loop);
  try {
    while (accT >= FRAME_MS){ update(); accT -= FRAME_MS; }
    draw();
  } catch (e){ accT = 0; console.error(e); }
}
// 自動テスト用
window.__game = {get scene(){ return scene; }, get P(){ return P; }, get boss(){ return boss; }, key, pressed, setKey,
  get score(){ return score; }, get fuda(){ return fudaGot; }, get stock(){ return fudaStock; }, set stock(v){ fudaStock = v; }, get camX(){ return camX; }, get mud(){ return mud; },
  solid: (x, y) => isSolid(tileAt(x, y)), plank: (x, y) => tileAt(x, y) === '=', TS,
  get enemies(){ return enemies; }, clearEnemies(){ enemies.length = 0; }, spawnDoro(px){ spawnEnemy({type: 'doro', x: px}); const e = enemies[enemies.length - 1]; e.vx = 0; e.dir = 0; e.still = true; return e; },
  get stage(){ return stageNo; }, setStage(n){ stageNo = n; }, unlockAll(){ SAVE.cleared = [1, 2]; saveNow(); }, get vents(){ return vents; }, get logs(){ return logs; },
  warp(x, y = 9){ P.x = x * TS; P.y = y * TS; P.vy = 0; camX = Math.max(0, P.x - 150); }};

applyHand();
Promise.race([document.fonts.load('16px "DotGothic16"'), new Promise(r => setTimeout(r, 2500))]).finally(() => {
  scene = 'title'; fit(); requestAnimationFrame(loop);
});
requestAnimationFrame(() => draw());
</script>
