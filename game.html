<title>福丸の術稽古 〜裏山の泥田坊〜 ｜ 神宿りの傀儡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0b0c14;color:#ece3cf;font-family:"DotGothic16",monospace;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  #bar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0;font-size:13px}
  #bar a,#bar button{color:#c9a35a;text-decoration:none;background:none;border:1px solid rgba(201,163,90,.4);
    font:inherit;padding:4px 10px;cursor:pointer}
  #stage{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000;
    box-shadow:0 0 0 2px #2a2216,0 0 0 4px #c9a35a33,0 10px 40px rgba(0,0,0,.6)}
  #pad{width:100%;max-width:560px;display:none;justify-content:space-between;align-items:center;padding:6px 14px 22px}
  .touch #pad{display:flex}
  .dir,.act{display:flex;gap:10px;align-items:center}
  .btn{width:62px;height:62px;border-radius:50%;border:2px solid #c9a35a88;background:#1a1a28;color:#ece3cf;
    display:grid;place-items:center;font:inherit;font-size:18px;touch-action:none}
  .btn.down{width:54px;height:54px;font-size:15px;transform:translateY(18px)}
  .btn.on{background:#c9a35a;color:#14121c}
  .btn.a{background:#6b2620;border-color:#e0705f}
  .btn.b{background:#203a6b;border-color:#7fa8e8;font-size:15px}
  .btn.a.on{background:#e0705f}.btn.b.on{background:#7fa8e8}
  .act .btn.a{transform:translateY(-14px)}
  @media (orientation:landscape) and (max-height:520px){
    .touch #pad{position:fixed;left:0;right:0;bottom:0;max-width:none;padding:0 16px 14px;pointer-events:none}
    .touch #pad .btn{pointer-events:auto;opacity:.75}
    #bar{position:fixed;top:0;z-index:2}
  }
  #help{font-size:12px;color:#8f8672;text-align:center;padding-bottom:10px}
  .touch #help{display:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <a href="index.html">← 公式サイトへ</a>
    <button id="mute" type="button">♪ 音：オン</button>
  </div>
  <div id="stage"><canvas id="cv" width="384" height="336"></canvas></div>
  <div id="pad">
    <div class="dir">
      <button class="btn" data-k="left" type="button">◀</button>
      <button class="btn down" data-k="down" type="button">▼</button>
      <button class="btn" data-k="right" type="button">▶</button>
    </div>
    <div class="act">
      <button class="btn b" data-k="b" type="button">湯</button>
      <button class="btn a" data-k="a" type="button">跳</button>
    </div>
  </div>
  <p id="help">←→ 移動　↓ しゃがむ　Z/スペース ジャンプ・会話送り　X 湯鉄砲・会話スキップ</p>
</div>

    const rows = poses[pose];
    const previousFill = ctx.fillStyle;

      }
    } finally {
      ctx.fillStyle = previousFill;
    }
  }

const IMG = {};
function makeSprite(rows, pal, flip, scale = 1){
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const ch = rows[y][flip ? w - 1 - x : x];
    if (ch !== '.'){ g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
  }
  if (scale === 1) return c;
  const s = document.createElement('canvas'); s.width = Math.round(w * scale); s.height = Math.round(h * scale);
  const sg = s.getContext('2d'); sg.imageSmoothingEnabled = false; sg.drawImage(c, 0, 0, s.width, s.height);
  return s;
}
function whiteOf(src){
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const g = c.getContext('2d'); g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);

  }

    px(c, col, x, top, w, H);
    if (rnd() < .6) for (let i = 0; i < 8; i++) px(c, col, x - 3 + i, top - 8 + i, w + 6 - i * 2, 1);
    for (let wy = top + 6; wy < base - 3; wy += 8) for (let wx = x + 4; wx < x + w - 4; wx += 7)
      if (rnd() < .35){ px(c, lit, wx, wy, 3, 3); px(c, '#c88a40', wx, wy + 2, 3, 1); }
    if (rnd() < .3) px(c, col, x + w - 9, top - 18, 4, 18);
    x += w + (rnd() * 9 | 0);
  }
  px(c, col, 450, 138, 27, 105); px(c, col, 456, 120, 15, 18); px(c, col, 462, 105, 3, 15);
  px(c, '#e8d8a8', 457, 150, 13, 13); px(c, col, 463, 153, 1, 6); px(c, col, 464, 157, 3, 1);

  const bam = document.createElement('canvas'); bam.width = 768; bam.height = H;
  const b = bam.getContext('2d');
  for (let i = 0; i < 28; i++){
    const bx = (rnd() * 768) | 0, bw = 4 + (rnd() * 4 | 0);
    px(b, '#16201c', bx, 60 + (rnd() * 60 | 0), bw, H);
    px(b, '#1e2c24', bx + 1, 60, 1, H);
    for (let yy = 90; yy < H; yy += 27 + (rnd() * 12 | 0)) px(b, '#24342a', bx - 1, yy, bw + 2, 2);
    for (let k = 0; k < 3; k++){ const ly = 75 + (rnd() * 150 | 0); px(b, '#1c2a22', bx + bw, ly, 12, 3); px(b, '#1c2a22', bx + bw + 9, ly - 2, 6, 2); }

})();

const COLS = 158, ROWS = 14;
let map, items, spawns, BOSS_COL = 141;
function buildLevel(){
  map = Array.from({length: ROWS}, () => Array(COLS).fill('.'));
  items = []; spawns = [];
  const ground = (x0, x1, top = 12) => { for (let x = x0; x <= x1; x++){ map[top][x] = '#'; for (let y = top + 1; y < ROWS; y++) map[y][x] = 'd'; } };
  const plank = (x0, x1, y) => { for (let x = x0; x <= x1; x++) map[y][x] = '='; };
  const gear = (x, y0, y1 = y0) => { for (let y = y0; y <= y1; y++) map[y][x] = 'G'; };
  const fuda = (x, y) => items.push({type: 'fuda', x: x * TS + 6, y: y * TS + 3, w: 12, h: 18});
  const tea = (x, y) => items.push({type: 'chawan', x: x * TS + 3, y: y * TS + 12, w: 18, h: 12});
  const doro = (x) => spawns.push({type: 'doro', x: x * TS});
  const onibi = (x, y) => spawns.push({type: 'onibi', x: x * TS, y: y * TS});

  ground(0, 24); fuda(8, 9); fuda(10, 9); doro(18);
  ground(25, 40, 11); doro(31); fuda(34, 8); fuda(36, 8);
  ground(44, 60);
  // 地面から2段で上れる橋（低い橋→高い橋）
  plank(46, 48, 10); plank(50, 54, 8); fuda(51, 7); fuda(53, 7); onibi(57, 7); doro(59);
  ground(61, 80); gear(63, 10, 11); tea(67, 11); doro(71); doro(77);
  gear(83, 10); gear(84, 10); gear(86, 9); gear(87, 9);
  ground(89, 110); onibi(92, 6); gear(97, 11); gear(98, 10, 11); gear(99, 9, 11); fuda(99, 7); onibi(102, 8); doro(105); doro(108);
  ground(114, 114); fuda(114, 9);
  ground(118, 140);
  // 高い橋の手前に踏み台を足した
  plank(119, 120, 10); plank(122, 126, 8); fuda(122, 7); fuda(126, 7); tea(124, 7); doro(129); doro(133); onibi(137, 7);
  ground(BOSS_COL, COLS - 1);
  for (let y = 0; y < 12; y++) map[y][COLS - 1] = 'G';
  // ボスの間の橋：泥田坊の頭の上を通り抜けられる高さ。左右に1本ずつ
  plank(BOSS_COL + 2, BOSS_COL + 4, 9); plank(BOSS_COL + 10, BOSS_COL + 12, 9);
}

/* ---------- 音 ---------- */
const Sound = (() => {
  let ac = null, master = null, muted = false, bgmTimer = null, step = 0, nextT = 0, bgmOn = false, song = 'field';
  try { muted = localStorage.getItem('fukumaru_mute') === '1'; } catch(e){}
  function unlock(){
    if (ac){ if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
    master = ac.createGain(); master.gain.value = muted ? 0 : .5; master.connect(ac.destination);
  }
  function tone(freq, dur, type = 'square', vol = .12, slide = 0, when = 0){
    if (!ac) return;
    const t = (when || ac.currentTime);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, vol = .15, hp = 800){
    if (!ac) return;
    const n = ac.sampleRate * dur, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(); s.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ac.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }
  const N = {C4:261.6,D4:293.7,E4:329.6,G4:392,A4:440,C5:523.3,D5:587.3,E5:659.3,G5:784,A3:220,G3:196,C3:130.8,D3:146.8,E3:164.8,A2:110,G2:98};
  const SONG = {
    field: {tempo: .16,
      mel: ['A4','.','C5','D5','E5','.','D5','C5','A4','.','G4','A4','C5','.','.','.','D5','.','E5','G5','E5','.','D5','C5','D5','.','C5','A4','G4','.','A4','.'],
      bas: ['A2','.','A3','.','A2','.','A3','.','G2','.','G3','.','G2','.','G3','.','D3','.','D3','.','E3','.','E3','.','A2','.','A3','.','A2','.','E3','.']},
    boss: {tempo: .12,
      mel: ['E5','.','E5','D5','E5','.','G5','.','E5','D5','C5','.','D5','.','A4','.','E5','.','E5','D5','E5','.','A4','.','C5','D5','E5','.','D5','.','C5','.'],
      bas: ['A2','A2','A3','A2','A2','A2','A3','A2','G2','G2','G3','G2','G2','G2','G3','G2','A2','A2','A3','A2','A2','A2','A3','A2','E3','E3','E3','D3','C3','C3','D3','E3']}
  };
  function schedule(){
    if (!ac || !bgmOn) return;
    const S = SONG[song];
    while (nextT < ac.currentTime + .25){
      const m = S.mel[step % S.mel.length], b = S.bas[step % S.bas.length];
      if (m !== '.') tone(N[m], S.tempo * 1.6, 'square', .045, 0, nextT);
      if (b !== '.') tone(N[b], S.tempo * 1.2, 'triangle', .11, 0, nextT);
      nextT += S.tempo; step++;

/* ---------- 当たり判定・移動 ---------- */
function overlap(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
// ドット単位の当たり判定（透明は除く。ignoreは当たらない色）
function pixelHit(ra, ax, ay, rb, bx, by, ignore = ''){
  ax = Math.round(ax); ay = Math.round(ay); bx = Math.round(bx); by = Math.round(by);
  const l = Math.max(ax, bx), t = Math.max(ay, by), r = Math.min(ax + ra[0].length, bx + rb[0].length), b = Math.min(ay + ra.length, by + rb.length);
  for (let y = t; y < b; y++) for (let x = l; x < r; x++)
    if (ra[y - ay][x - ax] !== '.' && rb[y - by][x - bx] !== '.' && !ignore.includes(rb[y - by][x - bx])) return true;
  return false;
}
function moveBody(o, oneWay = true){
  o.x += o.vx;
  let hitWall = false;
  const t0 = Math.floor(o.y / TS), t1 = Math.floor((o.y + o.h - 1) / TS);
  if (o.vx > 0){ const tx = Math.floor((o.x + o.w - 1) / TS); for (let ty = t0; ty <= t1; ty++) if (isSolid(tileAt(tx, ty))){ o.x = tx * TS - o.w; o.vx = 0; hitWall = true; break; } }
  if (o.vx < 0){ const tx = Math.floor(o.x / TS); for (let ty = t0; ty <= t1; ty++) if (isSolid(tileAt(tx, ty))){ o.x = (tx + 1) * TS; o.vx = 0; hitWall = true; break; } }
  const prevBottom = o.y + o.h;
  o.y += o.vy; o.ground = false;
  const l0 = Math.floor(o.x / TS), l1 = Math.floor((o.x + o.w - 1) / TS);
  if (o.vy > 0){
    // 足の裏（y+h）が少しでもタイルに入ったら着地
    const ty = Math.floor((o.y + o.h) / TS);
    for (let tx = l0; tx <= l1; tx++){
      const ch = tileAt(tx, ty);
      if (isSolid(ch) || (oneWay && ch === '=' && prevBottom <= ty * TS + 1)){ o.y = ty * TS - o.h; o.vy = 0; o.ground = true; break; }
    }
  } else if (o.vy < 0){
    const ty = Math.floor(o.y / TS);
    for (let tx = l0; tx <= l1; tx++) if (isSolid(tileAt(tx, ty))){ o.y = (ty + 1) * TS; o.vy = 0; break; }
  }
  return hitWall;
}
function burst(x, y, n, colors, sp = 2.2, up = 1.5){
  for (let i = 0; i < n; i++){ const a = Math.random() * Math.PI * 2, s = Math.random() * sp;
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - up, life: 20 + (Math.random() * 20 | 0), col: colors[(Math.random() * colors.length) | 0], g: .08, size: 1 + (Math.random() < .4 ? 1 : 0)}); }
}
function steam(x, y, n){
  for (let i = 0; i < n; i++) parts.push({x: x + (Math.random() - .5) * 15, y, vx: (Math.random() - .5) * .7, vy: -.6 - Math.random() * .9, life: 30 + (Math.random() * 20 | 0), col: Math.random() < .5 ? '#e8e4d8' : '#b8b4a8', g: -.008, size: 3});
}
function hurtPlayer(fromX){

  P.hp--; P.inv = 90; P.vy = -3.9; P.vx = (P.x + P.w / 2 < fromX ? -2.4 : 2.4); P.crouch = false; shake = 6; Sound.hurt();

/* ---------- 更新 ---------- */
function update(){
  frame++;
  if (scene === 'title'){
    titleT++;
    if (pressed.a || pressed.b){ Sound.unlock(); startGame(false); startTalk(TALK.intro, () => { scene = 'play'; Sound.bgm('field'); }); }
  }
  else if (scene === 'talk'){
    const line = talk.lines[talk.i][1];
    if (pressed.b || skipTap){ skipTap = false; const f = talkNext; talk = null; f(); clearPressed(); return; }
    if (talk.chars < line.length){ talk.chars += .5; if (frame % 4 === 0) Sound.talk(); }
    if (pressed.a){
      if (talk.chars < line.length) talk.chars = line.length;
      else { talk.i++; talk.chars = 0; if (talk.i >= talk.lines.length){ const f = talkNext; talk = null; f(); } }
    }
    updateParts();
  }
  else if (scene === 'play') updatePlay();
  else if (scene === 'over'){
    overT++;
    if (overT > 40){
      if (pressed.left){ overSel = 0; Sound.talk(); }
      if (pressed.right){ overSel = 1; Sound.talk(); }
      if (pressed.a || pressed.b){
        if (overSel === 0){ startGame(bossReached); if (bossReached) enterBoss(true); else { scene = 'play'; Sound.bgm('field'); } }
        else { scene = 'thanks'; thanksKind = 'quit'; thanksT = 0; }
      }
    }
  }
  else if (scene === 'result'){
    resultT++; updateParts();
    if (resultT > 60 && (pressed.a || pressed.b)){ scene = 'thanks'; thanksKind = 'clear'; thanksT = 0; }
  }
  else if (scene === 'thanks'){
    thanksT++;
    if (thanksT > 60 && (pressed.a || pressed.b)){ scene = 'title'; titleT = 0; }
  }
  clearPressed();
}
function clearPressed(){ for (const k in pressed) pressed[k] = false; }

function updatePlay(){
  timer++;
  // --- 福丸 ---
  P.crouch = key.down && P.ground && P.inv <= 60;
  const acc = P.ground ? .42 : .27, max = 2.55;
  if (P.crouch){ P.vx *= .6; if (Math.abs(P.vx) < .05) P.vx = 0; }
  else if (key.left && !key.right){ P.vx = Math.max(P.vx - acc, -max); P.face = -1; }
  else if (key.right && !key.left){ P.vx = Math.min(P.vx + acc, max); P.face = 1; }
  else { P.vx *= P.ground ? .7 : .92; if (Math.abs(P.vx) < .05) P.vx = 0; }
  if (P.ground) P.coyote = 6; else if (P.coyote > 0) P.coyote--;
  if (pressed.a) P.jumpBuf = 6; else if (P.jumpBuf > 0) P.jumpBuf--;
  if (P.jumpBuf > 0 && P.coyote > 0 && !P.crouch){ P.vy = -7.5; P.coyote = 0; P.jumpBuf = 0; Sound.jump(); }
  if (!key.a && P.vy < -2.4) P.vy = -2.4;
  P.vy = Math.min(P.vy + .36, 7.5);
  moveBody(P);
  if (P.ground && isSolid(tileAt(Math.floor((P.x + 7) / TS), Math.floor((P.y + P.h + 2) / TS))) && P.inv < 60){ P.safeX = P.x; P.safeY = P.y; }
  if (lockCam) P.x = Math.max(BOSS_COL * TS, Math.min(P.x, (COLS - 1) * TS - P.w));
  if (P.y > H + 30){
    P.hp--; shake = 4; Sound.hurt();
    if (P.hp <= 0){ gameOver(); return; }
    P.x = P.safeX; P.y = P.safeY - 6; P.vx = P.vy = 0; P.inv = 90;
  }
  if (P.inv > 0) P.inv--;
  P.anim += Math.abs(P.vx) > .3 && P.ground ? Math.abs(P.vx) * .09 : 0;
  // 湯鉄砲（しゃがみ中は撃てない）
  if (P.cool > 0) P.cool--;
  if (P.shootT > 0) P.shootT--;
  if (pressed.b && P.cool === 0 && shots.length < 3 && !P.crouch && P.inv <= 60){
    P.shootT = 14;
    const d = playerDrawPos('attack');
    const sx = P.face > 0 ? d.x + 23 : d.x + 26 - 23 - 9;
    shots.push({x: sx, y: d.y + 20, w: 9, h: 4, vx: 4.6 * P.face, vy: 0, life: 70});
    P.cool = 14; Sound.shot();
  }
  // --- 弾 ---
  for (const s of shots){
    s.x += s.vx; s.life--;
    if (frame % 3 === 0) parts.push({x: s.x + 4, y: s.y, vx: 0, vy: -.4, life: 14, col: '#f0f0ff', g: -.01});
    const ch = tileAt(Math.floor((s.x + (s.vx > 0 ? 8 : 0)) / TS), Math.floor((s.y + 2) / TS));
    if (isSolid(ch) || s.life <= 0){ s.dead = true; splash(s); }
  }
  // --- 敵 ---
  for (const e of enemies){
    e.anim++;
    if (e.dead){ e.dead++; continue; }
    if (e.flash > 0) e.flash--;
    if (e.type === 'doro'){
      if (e.still){ e.vy = 0; }
      else if (Math.abs(e.x - P.x) < 450){
        const wall = moveBody(e);
        e.vy = Math.min(e.vy + .3, 6);
        if (e.ground){
          if (e.vx === 0) e.vx = e.dir || -.55;
          const ahead = Math.floor((e.x + (e.vx > 0 ? e.w + 1 : -1)) / TS), below = Math.floor((e.y + e.h + 2) / TS);
          const t = tileAt(ahead, below);
          if (wall || !(isSolid(t) || t === '=')) e.vx = -(e.dir || e.vx || -.55);
          e.dir = e.vx;
        }
        if (e.y > H + 60) e.gone = true;
      }
    } else if (e.type === 'onibi'){
      const dx = P.x - e.x;
      if (Math.abs(dx) < 180) e.x += Math.sign(dx) * .5;
      e.y = e.by + Math.sin(e.anim / 20) * 15;
    }
    if (overlap(P, e)) hurtPlayer(e.x + e.w / 2);
    // 敵の当たり判定は絵の頭の先まで広げる
    const hb = {x: e.x - 1, y: e.y - 5, w: e.w + 2, h: e.h + 5};
    for (const s of shots) if (!s.dead && overlap(s, hb)){
      s.dead = true; e.hp--; e.flash = 8; Sound.hit(); burst(s.x, s.y, 5, ['#9fd8ff', '#fff']);
      if (e.hp <= 0){ e.dead = 1; score += e.type === 'doro' ? 200 : 300; Sound.kill(); steam(e.x + e.w / 2, e.y + e.h, 12); burst(e.x + e.w / 2, e.y + e.h / 2, 12, e.type === 'doro' ? ['#84513c', '#bd8040', '#341717'] : ['#7fd8ff', '#e8fbff']); }
    }
  }
  enemies = enemies.filter(e => !(e.dead > 24) && !e.gone);
  // --- アイテム ---
  for (const it of items){
    if (!it.got && overlap(P, it)){
      it.got = true;
      if (it.type === 'fuda'){ fudaGot++; score += 100; Sound.item(); burst(it.x + 6, it.y + 9, 8, ['#f2e6c4', '#c8342a']); }
      if (it.type === 'chawan'){ if (P.hp < 3) P.hp++; score += 50; Sound.heal(); steam(it.x + 9, it.y, 10); }
    }
  }
  items = items.filter(i => !i.got);
  // --- ボス ---
  if (!lockCam && P.x > (BOSS_COL + 3) * TS) enterBoss(false);
  if (boss) updateBoss();
  shots = shots.filter(s => !s.dead);
  // --- カメラ（福丸の整数位置にくっつける） ---
  if (lockCam){ camX += (BOSS_COL * TS - camX) * .1; if (Math.abs(BOSS_COL * TS - camX) < .5) camX = BOSS_COL * TS; }
  else {
    lookX += (P.face * 24 - lookX) * .08;
    camX = Math.round(P.x) + 7 - 168 + Math.round(lookX);
    camX = Math.max(0, Math.min(camX, (BOSS_COL - 2) * TS));
  }
  if (shake > 0) shake--;
  updateParts();
}
function splash(s){ burst(s.x + 4, s.y + 2, 6, ['#9fd8ff', '#ffffff', '#4bc6eb']); steam(s.x + 4, s.y, 2); Sound.splash(); }
function updateParts(){
  for (const p of parts){ p.vy += p.g; p.x += p.vx; p.y += p.vy; p.life--; }
  parts = parts.filter(p => p.life > 0);

const DP_R = Object.fromEntries(Object.entries(Dorotabo.poses).map(([k, r]) => [k, r.map(l => [...l].reverse().join(''))]));
for (const p of Object.keys(Dorotabo.poses)) IMG['db_' + p + '_R'] = makeSprite(Dorotabo.poses[p], Dorotabo.palette, true);
IMG.db_hurt_W_R = whiteOf(IMG.db_hurt_R);
const BIG = 1.15, BW_BIG = Math.round(96 * BIG), BH_BIG = Math.round(72 * BIG);
function scaleRows(rows, s){
  const h = Math.round(rows.length * s), w = Math.round(rows[0].length * s), out = [];
  for (let y = 0; y < h; y++){ let l = ''; for (let x = 0; x < w; x++) l += rows[Math.min(rows.length - 1, Math.floor(y / s))][Math.min(rows[0].length - 1, Math.floor(x / s))]; out.push(l); }
  return out;
}
function tinted(src){
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const g = c.getContext('2d'); g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(200,40,20,.22)'; g.fillRect(0, 0, c.width, c.height);
  return c;
}
const DP_BIG = {}, DP_BIG_R = {};
for (const p of Object.keys(Dorotabo.poses)){
  DP_BIG[p] = scaleRows(Dorotabo.poses[p], BIG); DP_BIG_R[p] = DP_BIG[p].map(l => [...l].reverse().join(''));
  IMG['dbB_' + p] = tinted(makeSprite(DP_BIG[p], Dorotabo.palette, false));
  IMG['dbB_' + p + '_R'] = tinted(makeSprite(DP_BIG[p], Dorotabo.palette, true));
}

function bossPose(){
  if (boss.action === 'rage') return (Math.floor(boss.t / 120) % 2) ? 'windup' : 'spitFull';   // 怒って膨れ上がる

}
function bossRows(pose){ return boss.big ? (boss.face < 0 ? DP_BIG[pose] : DP_BIG_R[pose]) : (boss.face < 0 ? Dorotabo.poses[pose] : DP_R[pose]); }
function bossDo(action){
  if (action === 'spit' && boss.first){ action = 'spitFirst'; boss.first = false; }
  boss.action = action; boss.t = 0; boss.fired = false; boss.hitThisAction = false;

const ARENA_L = () => BOSS_COL * TS + 2, ARENA_R = () => (COLS - 1) * TS;
function updateBoss(){
  const b = boss;
  if (b.dead){
    b.dead++;
    if (b.dead % 5 === 0){ steam(b.x + 10 + Math.random() * 80, b.y + 69, 4); burst(b.x + 10 + Math.random() * 80, b.y + 20 + Math.random() * 45, 5, ['#84513c', '#bd8040', '#fff']); Sound.splash(); shake = 2; }
    if (b.dead > 120){
      boss = null; Sound.stop(); Sound.clear();
      startTalk(TALK.ending, () => { scene = 'result'; resultT = 0; });
    }
    return;
  }
  if (b.flash > 0) b.flash--;
  b.t += FRAME_MS;
  const angry = b.big;
  const bw = b.bw, pcx = P.x + P.w / 2, bcx = b.x + bw / 2;
  const above = P.y + P.h < b.y + 24 * b.s;                 // 福丸が橋の上など、頭より上にいる
  const front = b.face < 0 ? b.x + 6 * b.s - (P.x + P.w) : P.x - (b.x + bw - 6 * b.s);   // 腕の届く側との距離
  if (b.chipT > 0) b.chipT--;
  // 怒って大きくなる最中は動かない
  if (b.action === 'rage'){
    if (frame % 4 === 0){ shake = 3; steam(b.x + Math.random() * bw, b.y + 70 * b.s, 2); }
    if (b.t >= 1200){ b.action = 'idle'; b.t = 0; b.idleFor = 300; }
    return;
  }
  // 動作の終わり
  const dur = b.action === 'walk' ? b.walkFor : Dorotabo.durations[b.action];
  if (b.action !== 'idle' && b.t >= dur){ b.action = 'idle'; b.t = 0; b.idleFor = angry ? 350 + Math.random() * 350 : 650 + Math.random() * 500; }
  // 次の動作を決める（待機中はいつでも福丸の方を向き直す）
  if (b.action === 'idle'){
    b.face = pcx < bcx ? -1 : 1;
    if (b.t >= b.idleFor){
      if (above){
        // 上にいる福丸には届かないので、間合いを取りに離れる
        b.walkDir = pcx < bcx ? 1 : -1; b.walkFor = 900; bossDo('walk');
      } else if (front < 26){
        bossDo('attack');
      } else if (front > 150 || Math.random() < (angry ? .55 : .4)){
        // ずるずると近づいてくる
        b.walkDir = b.face; b.walkFor = Math.min(1800, (front - 10) / (angry ? 1.25 : .85) * FRAME_MS); bossDo('walk');
      } else bossDo('spit');
    }
  }
  if (b.action === 'walk'){
    const sp = angry ? 1.25 : .85;
    b.x += b.walkDir * sp;
    if (b.walkDir === b.face && front < 22){ b.action = 'idle'; b.t = 0; b.idleFor = 120; }   // 間合いに入ったらすぐ腕を振る
    if (frame % 14 === 0){ steam(b.x + (b.walkDir < 0 ? 80 : 16), b.y + 68, 1); }
  }
  b.x = Math.max(ARENA_L(), Math.min(b.x, ARENA_R() - bw));
  const pose = bossPose(), rows = bossRows(pose);
  // 泥つぶて発射（向いている方へ）
  if (pose === 'spitRelease' && !b.fired){
    b.fired = true; Sound.spit();
    const ox = b.face < 0 ? Dorotabo.mudShot.originX * b.s : bw - Dorotabo.mudShot.originX * b.s - 9;
    mud.push({x: b.x + ox, y: b.y + Math.round(Dorotabo.mudShot.originY * b.s), vx: b.face * (Dorotabo.mudShot.speed / 60) * (angry ? 1.5 : 1.15)});
  }
  const pp = playerPose(), d = playerDrawPos(pp), prow = playerRows(pp);
  // 腕振り
  if ((pose === 'swing' || pose === 'attack') && !b.hitThisAction && P.inv <= 0 && pixelHit(rows, b.x, b.y, prow, d.x, d.y, 'QUVF')){
    b.hitThisAction = true; hurtPlayer(bcx);
  }
  // 体に触れても痛い
  if (P.inv <= 0 && pixelHit(rows, b.x, b.y, prow, d.x, d.y, 'QUVF')) hurtPlayer(bcx);
  // 泥つぶて
  for (const m of mud){
    m.x += m.vx;
    if (P.inv <= 0 && pixelHit(Dorotabo.mudShot.rows, m.x, m.y, prow, d.x, d.y, 'QUVF')){ m.dead = true; hurtPlayer(m.x); burst(m.x + 4, m.y + 3, 10, ['#84513c', '#bd8040', '#542d38']); }
    for (const s of shots) if (!s.dead && overlap(s, {x: m.x, y: m.y, w: 9, h: 7})){ s.dead = true; m.dead = true; splash(s); burst(m.x + 4, m.y + 3, 8, ['#84513c', '#bd8040']); score += 50; }
    if (m.x < ARENA_L() - 20 || m.x > ARENA_R() + 10) m.dead = true;
  }
  mud = mud.filter(m => !m.dead);
  // 湯鉄砲が当たった（舌が垂れている間だけ効く）
  for (const s of shots){
    if (s.dead) continue;
    const wr = s.vx > 0 ? WATER : WATER.map(r => [...r].reverse().join(''));
    if (pixelHit(wr, s.x, s.y, rows, b.x, b.y)){
      s.dead = true;
      if (pose === 'spitRest'){
        // 隙を突いた：大きく効く
        b.hp = Math.max(0, b.hp - 2); b.flash = 12; Sound.hit(); shake = 6; score += 500;
        burst(s.x + 4, s.y, 14, ['#9fd8ff', '#fff', '#ee8544']); steam(bcx, b.y + 30, 6); popText(s.x - 6, s.y - 16, '効いた！');
      } else {
        // それ以外：泥に阻まれて少しだけ効く
        b.hp = Math.max(0, b.hp - .25); b.flash = Math.max(b.flash, 3); Sound.clang(); score += 20;
        burst(s.x + 4, s.y + 2, 5, ['#bd8040', '#9fd8ff']);
        if (b.chipT <= 0){ popText(s.x - 10, s.y - 14, '少し効いた'); b.chipT = 40; }
      }
      if (b.hp <= 0){ b.dead = 1; score += 3000; mud = []; enemies.forEach(e => { if (!e.dead){ e.dead = 1; steam(e.x + 11, e.y + 16, 8); } }); }
      else if (!b.big && b.hp <= b.maxHp / 2){
        // 体力が半分を切ったら怒って大きくなる（足元の位置と中心はそのまま）
        b.big = true; b.s = BIG; b.x -= (BW_BIG - 96) / 2; b.bw = BW_BIG; b.y = 12 * TS - Math.round(70 * BIG);
        b.action = 'rage'; b.t = 0; mud = []; Sound.land(); Sound.roar(); shake = 14;
        popText(b.x + 10, b.y - 10, '大泥田坊が怒った！');
        if (!b.teaDropped){ b.teaDropped = true; const tx = (BOSS_COL + 3) * TS + 3; items.push({type: 'chawan', x: tx, y: 9 * TS - 12, w: 18, h: 12}); steam(tx + 9, 9 * TS - 12, 10); popText(tx - 30, 9 * TS - 34, '椿の差し入れ！'); Sound.item(); }
      } else if (pose === 'spitRest') bossDo('hurt');
    }
  }
}
const popups = [];
function popText(x, y, t){ popups.push({x, y, t, life: 40}); }

/* ---------- 描画 ---------- */
function drawBG(cx){
  ctx.drawImage(BG.sky, 0, 0);
  ctx.fillStyle = '#ffd88a'; const sunX = Math.round(270 - cx * .03), sunY = 150;
  for (let y = -21; y <= 21; y++){ const w = Math.floor(Math.sqrt(441 - y * y)); ctx.fillRect(sunX - w, sunY + y, w * 2, 1); }
  ctx.fillStyle = '#f0a860'; for (let y = 3; y <= 21; y += 4) ctx.fillRect(sunX - 24, sunY + y, 48, 1);
  const lay = (img, f, y) => { const ox = -((cx * f) % img.width); for (let x = ox - img.width; x < W; x += img.width) ctx.drawImage(img, Math.round(x), y); };
  lay(BG.mt, .12, 0); lay(BG.city, .3, 9); lay(BG.bam, .55, 36);
}
function drawMap(cx){
  const t0 = Math.floor(cx / TS), t1 = t0 + 17;
  for (let ty = 0; ty < ROWS; ty++) for (let tx = t0; tx <= t1; tx++){
    const ch = tileAt(tx, ty);
    if (ch === '.') continue;
    let k = ch === '#' && ty > 0 && isSolid(tileAt(tx, ty - 1)) ? 'd' : ch;
    if (k === 'd'){ const v = (tx * 7 + ty * 13) % 3; k = v === 0 ? 'd' : v === 1 ? 'd2' : 'd3'; }
    const img = TILE[k];
    if (img) ctx.drawImage(img, tx * TS - cx, ty * TS);
  }
}
function drawSprite(img, x, y){ ctx.drawImage(img, Math.round(x), Math.round(y)); }
function drawText(t, x, y, col = '#ece3cf', size = 16, align = 'left', shadow = true){
  ctx.font = `${size}px "DotGothic16", monospace`; ctx.textAlign = align; ctx.textBaseline = 'top';
  if (shadow){ ctx.fillStyle = '#000'; ctx.fillText(t, x + 1, y + 1); }
  ctx.fillStyle = col; ctx.fillText(t, x, y);
}
function drawWindow(x, y, w, h){
  ctx.fillStyle = '#0c1440'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#142060'; ctx.fillRect(x + 3, y + 3, w - 6, (h - 6) / 2);
  ctx.strokeStyle = '#f4eee0'; ctx.lineWidth = 1; ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
  ctx.strokeStyle = '#c9a35a'; ctx.strokeRect(x + 4.5, y + 4.5, w - 9, h - 9);
}
function wrapJa(text, maxChars){
  const out = []; let line = '';
  for (const ch of text){
    if (line.length >= maxChars && !'、。！？…」）'.includes(ch)){ out.push(line); line = ''; }
    line += ch;
  }
  if (line) out.push(line);
  return out;
}
function drawHUD(){
  for (let i = 0; i < 3; i++) drawSprite(IMG[i < P.hp ? 'tama' : 'tama_empty'], 10 + i * 16, 10);
  drawSprite(IMG.fuda, 70, 7);
  drawText('×' + fudaGot, 85, 8, '#f2e6c4');
  drawText(String(score).padStart(6, '0'), 372, 8, '#ffd36a', 16, 'right');
  if (boss && !boss.dead){
    drawText('大泥田坊', 10, 32, '#d8a868', 14);
    ctx.fillStyle = '#000'; ctx.fillRect(76, 35, 152, 10);
    ctx.fillStyle = '#c8342a'; ctx.fillRect(77, 36, Math.max(0, 150 * boss.hp / boss.maxHp), 8);
    for (let i = 1; i < boss.maxHp; i++){ ctx.fillStyle = '#000'; ctx.fillRect(77 + Math.round(150 * i / boss.maxHp), 36, 1, 8); }
  }
}
function drawWorld(){
  const sx = shake > 0 ? ((Math.random() * 6) | 0) - 3 : 0, sy = shake > 0 ? ((Math.random() * 6) | 0) - 3 : 0;
  ctx.save(); ctx.translate(sx, sy);
  const cx = Math.round(camX);
  drawBG(cx); drawMap(cx);
  for (const it of items){
    const bob = it.type === 'fuda' ? Math.round(Math.sin((frame + it.x) / 12) * 3) : 0;
    drawSprite(IMG[it.type], it.x - cx, it.y + bob);
  }
  for (const e of enemies){
    if (e.type === 'doro'){
      const f = (e.anim >> 4) % 2 ? 'mini2' : 'mini1';
      const img = e.flash > 0 && (e.flash & 2) ? IMG.mini_W : IMG[e.vx > 0 ? f + '_R' : f];
      if (e.dead){ const sq = Math.min(1, e.dead / 20); ctx.globalAlpha = 1 - sq; ctx.drawImage(img, Math.round(e.x - 1 - cx), Math.round(e.y - 2 + sq * 12), 24, Math.max(1, 18 * (1 - sq))); ctx.globalAlpha = 1; }
      else drawSprite(img, e.x - 1 - cx, e.y - 2);
    } else {
      const f = (e.anim >> 3) % 2 ? 'onibi2' : 'onibi1';
      if (e.dead) ctx.globalAlpha = Math.max(0, 1 - e.dead / 20);
      drawSprite(e.flash > 0 ? IMG.onibi1_W : IMG[f], e.x - 1 - cx, e.y - 1);
      ctx.globalAlpha = 1;
    }
  }
  // ボス
  if (boss){
    const b = boss, pose = bossPose();
    const R = b.face > 0 ? '_R' : '', pre = b.big ? 'dbB_' : 'db_';
    // 怒って大きくなる最中は、小さい姿と大きい姿を交互に見せる
    const growing = b.action === 'rage' && b.t < 700 && (frame >> 2) % 2;
    const img = growing ? IMG['db_' + pose + R] : IMG[pre + pose + R];
    const ox = growing ? (b.bw - 96) / 2 : 0, oy = growing ? (Math.round(70 * b.s) - 70) : 0;
    if (b.dead){ ctx.globalAlpha = Math.max(0, 1 - b.dead / 120); const sink = Math.round(b.dead / 6); ctx.drawImage(img, Math.round(b.x) - cx, b.y + sink); ctx.globalAlpha = 1; }
    else drawSprite(b.flash > 0 && (b.flash & 2) ? IMG[pre + 'hurt_W' + R] : img, b.x + ox - cx, b.y + oy);
    // 隙のある時は舌の上に小さく光
    if (!b.dead && pose === 'spitRest' && (frame >> 3) % 2) { ctx.fillStyle = '#fff6c0'; ctx.fillRect(Math.round(b.x + (b.face < 0 ? 14 : 80) * b.s) - cx, Math.round(b.y + 28 * b.s), 2, 2); }
  }
  for (const m of mud) drawSprite(IMG.mud, m.x - cx, m.y);
  // 福丸
  if (!(P.inv > 0 && P.inv <= 60 && (P.inv & 4))){
    const pose = playerPose(), d = playerDrawPos(pose);
    drawSprite(IMG['fk_' + pose + (P.face > 0 ? '' : '_L')], d.x - cx, d.y);
  }
  for (const s of shots) drawSprite(s.vx > 0 ? IMG.water : IMG.water_L, s.x - cx, s.y);
  for (const p of parts){ ctx.fillStyle = p.col; const s = p.size || 1; ctx.fillRect(Math.round(p.x - cx), Math.round(p.y), s, s); }
  for (const p of popups){ drawText(p.t, Math.round(p.x - cx), Math.round(p.y - (40 - p.life) * .4), '#ffe0a0', 12); p.life--; }
  for (let i = popups.length - 1; i >= 0; i--) if (popups[i].life <= 0) popups.splice(i, 1);
  ctx.restore();
}
function drawTitle(){
  drawBG(titleT * .9);
  ctx.fillStyle = 'rgba(8,8,20,.45)'; ctx.fillRect(0, 0, W, H);
  const bob = Math.round(Math.sin(titleT / 15) * 3);
  ctx.drawImage(IMG.fk_front, 166, 168 + bob, 52, 80);
  drawText('神宿りの傀儡 外伝', 192, 40, '#c9a35a', 16, 'center');
  drawText('福丸の術稽古', 192, 66, '#ffd36a', 36, 'center');
  drawText('〜 裏山の泥田坊 〜', 192, 116, '#ece3cf', 16, 'center');
  if ((titleT >> 5) % 2 === 0) drawText(isTouch ? '「跳」ボタンで はじめる' : 'Zキーで はじめる', 192, 274, '#fff', 16, 'center');
  drawText('©竜田揚げ', 372, 314, '#8f8672', 12, 'right', false);
}
function drawTalk(){
  const L = talk.lines[talk.i], name = L[0], text = L[1].slice(0, Math.floor(talk.chars));
  drawWindow(9, 228, 366, 100);
  ctx.fillStyle = '#0c1440'; ctx.fillRect(18, 204, 96, 28);
  ctx.strokeStyle = '#c9a35a'; ctx.strokeRect(18.5, 204.5, 95, 27);
  ctx.font = '16px "DotGothic16", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000'; ctx.fillText(name, 67, 219);
  ctx.fillStyle = NAMECOL[name] || '#fff'; ctx.fillText(name, 66, 218);
  wrapJa(text, 20).forEach((l, i) => drawText(l, 24, 246 + i * 22, '#f4eee0'));
  if (talk.chars >= L[1].length && (frame >> 4) % 2) drawText('▼', 352, 306, '#ffd36a', 14);
  ctx.fillStyle = 'rgba(12,20,64,.85)'; ctx.fillRect(276, 34, 98, 22);
  ctx.strokeStyle = '#c9a35a'; ctx.strokeRect(276.5, 34.5, 97, 21);
  drawText(isTouch ? 'スキップ▶▶' : 'X:スキップ', 325, 37, '#ece3cf', 14, 'center');
}
function drawOver(){
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(IMG.fk_hurt, 166, 24, 52, 80);
  drawText('やられてしもうた……', 192, 122, '#ffd36a', 24, 'center');
  drawText(bossReached ? '大泥田坊の前から やり直す' : 'はじめから やり直す', 192, 166, '#ece3cf', 16, 'center');
  if (overT > 40){
    ['もう一度', 'やめる'].forEach((t, i) => {
      const x = i === 0 ? 126 : 258, sel = overSel === i;
      drawText(t, x, 214, sel ? '#ffd36a' : '#8f8672', 18, 'center');
      if (sel && (frame >> 4) % 2 === 0) drawText('▶', x - 52, 214, '#ffd36a', 18);
    });
    drawText(isTouch ? '◀▶で選んで「跳」で決定' : '←→で選んで Zキーで決定', 192, 258, '#ece3cf', 14, 'center');
  }
}
const THANKS = {
  quit:  ['遊んでくれてありがとう！', 'また来てね！'],
  clear: ['おめでとう！', '今日はきっと', '良いことがあるよ！', 'スマイルスマイル！'],
};
function drawThanks(){
  drawBG(frame * .45);
  ctx.fillStyle = 'rgba(8,8,20,.6)'; ctx.fillRect(0, 0, W, H);
  const lines = THANKS[thanksKind], clr = thanksKind === 'clear', top = clr ? 44 : 84, sp = 28;
  drawWindow(36, top - 20, 312, lines.length * sp + 70);
  lines.forEach((l, i) => drawText(l, 192, top + i * sp, i === 0 ? '#ffd36a' : '#f4eee0', 20, 'center'));
  drawText('竜田揚げ', 324, top + lines.length * sp + 14, '#c9a35a', 16, 'right');
  const bow = clr ? Math.round(Math.sin(frame / 10) * 3) : ((frame >> 5) % 2) * 4;
  ctx.drawImage(IMG[clr ? 'fk_run' : 'fk_front'], 166, 222 + bow, 52, 80);
  if (thanksT > 60 && (frame >> 5) % 2 === 0) drawText(isTouch ? '「跳」でタイトルへ' : 'Zキーでタイトルへ', 192, 310, '#fff', 14, 'center');
}
function drawResult(){
  drawBG(timer * .3);
  ctx.fillStyle = 'rgba(8,8,20,.55)'; ctx.fillRect(0, 0, W, H);
  drawText('稽古 完了！', 192, 30, '#ffd36a', 36, 'center');
  drawWindow(54, 96, 276, 138);
  const sec = Math.floor(timer / 60), t = `${Math.floor(sec / 60)}分${String(sec % 60).padStart(2, '0')}秒`;
  drawText('かかった時間', 74, 118); drawText(t, 310, 118, '#fff', 16, 'right');
  drawText('集めた札', 74, 148); drawText(`${fudaGot} / ${fudaTotal}`, 310, 148, '#fff', 16, 'right');
  drawText('得点', 74, 178); drawText(String(score), 310, 178, '#ffd36a', 16, 'right');
  const rank = fudaGot === fudaTotal ? (sec < 180 ? '免許皆伝' : '師範代') : (fudaGot >= fudaTotal / 2 ? '一人前' : '見習い');
  drawText('評価：' + rank, 192, 250, '#8fb4ff', 18, 'center');
  ctx.drawImage(IMG.fk_attack, 26, 246, 52, 80);
  if (resultT > 60 && (frame >> 5) % 2 === 0) drawText(isTouch ? '「跳」で つぎへ' : 'Zキーで つぎへ', 192, 296, '#fff', 16, 'center');
}
function draw(){
  ctx.imageSmoothingEnabled = false;
  if (scene === 'loading'){ ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); drawText('よみこみ中…', 192, 156, '#ece3cf', 16, 'center', false); return; }
  if (scene === 'title'){ drawTitle(); return; }
  if (scene === 'result'){ drawResult(); return; }
  if (scene === 'thanks'){ drawThanks(); return; }
  drawWorld(); drawHUD();
  if (scene === 'talk') drawTalk();
  if (scene === 'over') drawOver();
}

/* ---------- ループ ---------- */
let last = 0, accT = 0;
function loop(t){
  if (!last) last = t;
  accT += Math.min(100, t - last); last = t;
  requestAnimationFrame(loop);
  try {
    while (accT >= FRAME_MS){ update(); accT -= FRAME_MS; }
    draw();
  } catch (e){ accT = 0; console.error(e); }
}
// 自動テスト用
window.__game = {get scene(){ return scene; }, get P(){ return P; }, get boss(){ return boss; }, key, pressed, setKey,
  get score(){ return score; }, get fuda(){ return fudaGot; }, get camX(){ return camX; }, get mud(){ return mud; },
  solid: (x, y) => isSolid(tileAt(x, y)), plank: (x, y) => tileAt(x, y) === '=', TS,
  get enemies(){ return enemies; }, clearEnemies(){ enemies.length = 0; }, spawnDoro(px){ spawnEnemy({type: 'doro', x: px}); const e = enemies[enemies.length - 1]; e.vx = 0; e.dir = 0; e.still = true; return e; },
  warp(x, y = 9){ P.x = x * TS; P.y = y * TS; P.vy = 0; camX = Math.max(0, P.x - 150); }};

fit();
Promise.race([document.fonts.load('16px "DotGothic16"'), new Promise(r => setTimeout(r, 2500))]).finally(() => {
  scene = 'title'; fit(); requestAnimationFrame(loop);
});
requestAnimationFrame(() => draw());
</script>
