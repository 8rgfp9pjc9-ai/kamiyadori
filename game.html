<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>福丸の術稽古 ｜ 神宿りの傀儡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0b0c14;color:#ece3cf;font-family:"DotGothic16",monospace;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  #bar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0;font-size:13px}
  #bar a,#bar button{color:#c9a35a;text-decoration:none;background:none;border:1px solid rgba(201,163,90,.4);
    font:inherit;padding:4px 10px;cursor:pointer}
  #stage{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000;
    box-shadow:0 0 0 2px #2a2216,0 0 0 4px #c9a35a33,0 10px 40px rgba(0,0,0,.6)}
  #pad{width:100%;max-width:560px;display:none;justify-content:space-between;align-items:center;padding:6px 14px 22px}
  .touch #pad{display:flex}
  .dir,.act{display:flex;gap:10px;align-items:center}
  .btn{width:62px;height:62px;border-radius:50%;border:2px solid #c9a35a88;background:#1a1a28;color:#ece3cf;
    display:grid;place-items:center;font:inherit;font-size:18px;touch-action:none}
  .btn.down{width:54px;height:54px;font-size:15px;transform:translateY(18px)}
  .btn.on{background:#c9a35a;color:#14121c}
  .btn.a{background:#6b2620;border-color:#e0705f}
  .btn.b{background:#203a6b;border-color:#7fa8e8;font-size:15px}
  .btn.a.on{background:#e0705f}.btn.b.on{background:#7fa8e8}
  .act .btn.a{transform:translateY(-14px)}
  @media (orientation:landscape) and (max-height:520px){
    .touch #pad{position:fixed;left:0;right:0;bottom:0;max-width:none;padding:0 16px 14px;pointer-events:none}
    .touch #pad .btn{pointer-events:auto;opacity:.75}
    #bar{position:fixed;top:0;z-index:2}
  }
  #help{font-size:12px;color:#8f8672;text-align:center;padding-bottom:10px}
  .touch #help{display:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <a href="index.html">← 公式サイトへ</a>
    <button id="mute" type="button">♪ 音：オン</button>
  </div>
  <div id="stage"><canvas id="cv" width="384" height="336"></canvas></div>
  <div id="pad">
    <div class="dir">
      <button class="btn" data-k="left" type="button">◀</button>
      <button class="btn down" data-k="down" type="button">▼</button>
      <button class="btn" data-k="right" type="button">▶</button>
    </div>
    <div class="act">
      <button class="btn b" data-k="b" type="button">湯</button>
      <button class="btn a" data-k="a" type="button">跳</button>
    </div>
  </div>
  <p id="help">←→ 移動　↓ しゃがむ　Z/スペース ジャンプ・会話送り　X 湯鉄砲・会話スキップ</p>
</div>

    }

        !Number.isInteger(scale) || scale < 1) {
      throw new RangeError("x と y は整数、scale は1以上の整数で指定してください。");
    }

    const rows = poses[pose];
    const previousFill = ctx.fillStyle;

        }
      }
    } finally {
      ctx.fillStyle = previousFill;
    }
  }

  };

  const duration = Object.freeze(Object.fromEntries(Object.entries(clips).map(
    ([key, frames]) => [key,frames.reduce((total, [,ms]) => total+ms,0)]
  )));
  function frameAt(action, ms) {
    if (!Number.isFinite(ms)) throw new TypeError("経過時間にはミリ秒を指定してください。");
    if (action === "idle") return "idle";
    if (!Object.hasOwn(clips,action)) throw new RangeError("攻撃名は plane または nail です。");

    for (const [pose,length] of clips[action]) {
      if (t < length) return pose;
      t -= length;
    }
    return "idle";
  }
  function sample(action, ms) {
    const pose = frameAt(action,ms);
    const elapsed = ms-releaseMs[action];
    let projectile = null;

        projectile = {sprite:"curl"+(Math.floor(elapsed/85)%4),x:17-Math.floor(elapsed*.122),y:113};

        const travel = elapsed*.172;

const PIMG = {}, PDIM = {};
for (const k in PORTRAITS){
  const im = new Image();
  im.onload = () => {
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0);
    x.globalCompositeOperation = 'source-atop'; x.fillStyle = 'rgba(8,6,28,.58)'; x.fillRect(0, 0, c.width, c.height);
    PIMG[k] = im; PDIM[k] = c;
  };
  im.src = PORTRAITS[k];
}
// 登場順に描く（後ろ→手前）。cx は中心、最初からいる人は cast に
const PORTRAIT_POS = {'灯真': {key: 'toma', cx: 246}, '椿': {key: 'tsubaki', cx: 326}, '福丸': {key: 'fk_fight', cx: 70}};
const PORTRAIT_ORDER = ['灯真', '椿', '福丸'];
function talkCast(lines){
  return lines.cast || ['福丸', '灯真', '椿'];
}
function drawPortraits(){
  const cast = new Set(talkCast(talk.lines));
  let face = 'fk_fight';
  for (let i = 0; i <= talk.i; i++){
    const L = talk.lines[i];
    if (PORTRAIT_POS[L[0]]) cast.add(L[0]);
    if (L[0] === '福丸' && L[2]) face = L[2];
  }
  const speaker = talk.lines[talk.i][0];
  for (const who of PORTRAIT_ORDER){
    if (!cast.has(who)) continue;
    const key = who === '福丸' ? face : PORTRAIT_POS[who].key;
    const on = who === speaker;
    const img = on ? PIMG[key] : PDIM[key];
    if (!img) continue;
    const x = Math.round(PORTRAIT_POS[who].cx - img.width / 2);
    const y = 240 - img.height - (on ? 3 : 0);
    ctx.drawImage(img, x, y);
  }
}

const NAMECOL = {'椿': '#f08c8c', '灯真': '#8fb4ff', '福丸': '#ffd36a', '大泥田坊': '#d8a868', '宝条吉利': '#c890e8', '源八': '#e0a060'};

/* ---------- 状態 ---------- */
const FRAME_MS = 1000 / 60;
let scene = 'loading';
let talk = null, talkNext = null;
let P, shots, enemies, parts, boss, mud, camX, shake, timer, score, fudaGot, fudaTotal, bossReached, frame = 0, lockCam = false, lookX = 24;
let overT = 0, resultT = 0, titleT = 0, thanksT = 0, overSel = 0, thanksKind = 'quit';
let selT = 0, selIdx = 0, lockMsgT = 0, newlyOpened = false;
const STAGES = [
  {no: 1, kan: '壱の巻', name: '裏山の泥田坊', boss: '大泥田坊', bgm: 'field'},
  {no: 2, kan: '弐の巻', name: '蒸気の工場街', boss: '棟梁 源八', bgm: 'factory'},
];

const STAGE_BGM = () => STG().bgm;
// セーブ：クリアした巻と、いちばん良い評価（この端末のブラウザに保存）
const SAVE = (() => { try { const d = JSON.parse(localStorage.getItem('fukumaru_save') || '{}'); return {cleared: d.cleared || [], best: d.best || {}}; } catch(e){ return {cleared: [], best: {}}; } })();
function saveNow(){ try { localStorage.setItem('fukumaru_save', JSON.stringify(SAVE)); } catch(e){} }
const stageOpen = n => n === 1 || SAVE.cleared.includes(n - 1);
const RANKS = ['見習い', '一人前', '師範代', '免許皆伝'];
function rankOf(){ const sec = Math.floor(timer / 60); return fudaGot === fudaTotal ? (sec < 180 ? '免許皆伝' : '師範代') : (fudaGot >= fudaTotal / 2 ? '一人前' : '見習い'); }
function stageCleared(){
  newlyOpened = !SAVE.cleared.includes(stageNo) && stageNo < STAGES.length;
  if (!SAVE.cleared.includes(stageNo)) SAVE.cleared.push(stageNo);
  const r = rankOf(), prev = SAVE.best[stageNo];
  if (!prev || RANKS.indexOf(r) > RANKS.indexOf(prev)) SAVE.best[stageNo] = r;
  saveNow();
}

function newPlayer(x, y){
  return {x, y, w: 14, h: 36, vx: 0, vy: 0, ground: false, face: 1, hp: 3, inv: 0, cool: 0, anim: 0, shootT: 0,
    safeX: x, safeY: y, coyote: 0, jumpBuf: 0, crouch: false};
}
function startGame(fromBoss){
  buildLevel();
  shots = []; enemies = []; parts = []; mud = []; boss = null; shake = 0; lockCam = false; lookX = 24;
  fudaTotal = items.filter(i => i.type === 'fuda').length;
  if (!fromBoss){ timer = 0; score = 0; fudaGot = 0; bossReached = false; }
  for (const s of spawns) spawnEnemy(s);
  if (fromBoss){
    P = newPlayer((BOSS_COL - 3) * TS, 10 * TS - 4);
    enemies = enemies.filter(e => e.x > (BOSS_COL - 6) * TS);
    items = items.filter(i => i.x > (BOSS_COL - 6) * TS);
  } else P = newPlayer(2 * TS, 10 * TS);
  camX = Math.max(0, P.x - 150);
}
function groundTopAt(px){ const tx = Math.floor(px / TS); for (let y = 0; y < ROWS; y++) if (isSolid(tileAt(tx, y))) return y * TS; return 12 * TS; }
function spawnEnemy(s){
  if (s.type === 'doro') enemies.push({type: 'doro', x: s.x, y: groundTopAt(s.x + 12) - 16, w: 22, h: 16, vx: -.55, vy: 0, hp: 2, flash: 0, anim: (Math.random() * 40) | 0, dead: 0});
  if (s.type === 'kara') enemies.push({type: 'kara', x: s.x, y: groundTopAt(s.x + 12) - 24, w: 16, h: 24, vx: -.6, vy: 0, hp: 2, flash: 0, anim: (Math.random() * 40) | 0, dead: 0});
  if (s.type === 'hebi') enemies.push({type: 'hebi', x: s.x, y: s.y, by: s.y, w: 18, h: 10, vx: 0, vy: 0, hp: 1, flash: 0, anim: (Math.random() * 60) | 0, dead: 0, face: -1});
  if (s.type === 'onibi') enemies.push({type: 'onibi', x: s.x, y: s.y, by: s.y, w: 15, h: 15, vx: 0, vy: 0, hp: 1, flash: 0, anim: (Math.random() * 60) | 0, dead: 0});
}
function startTalk(lines, then){ talk = {lines, i: 0, chars: 0}; talkNext = then; scene = 'talk'; }

/* ---------- 当たり判定・移動 ---------- */
function overlap(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
// ドット単位の当たり判定（透明は除く。ignoreは当たらない色）
function pixelHit(ra, ax, ay, rb, bx, by, ignore = ''){
  ax = Math.round(ax); ay = Math.round(ay); bx = Math.round(bx); by = Math.round(by);
  const l = Math.max(ax, bx), t = Math.max(ay, by), r = Math.min(ax + ra[0].length, bx + rb[0].length), b = Math.min(ay + ra.length, by + rb.length);
  for (let y = t; y < b; y++) for (let x = l; x < r; x++)
    if (ra[y - ay][x - ax] !== '.' && rb[y - by][x - bx] !== '.' && !ignore.includes(rb[y - by][x - bx])) return true;
  return false;
}
function moveBody(o, oneWay = true){
  o.x += o.vx;
  let hitWall = false;
  const t0 = Math.floor(o.y / TS), t1 = Math.floor((o.y + o.h - 1) / TS);
  if (o.vx > 0){ const tx = Math.floor((o.x + o.w - 1) / TS); for (let ty = t0; ty <= t1; ty++) if (isSolid(tileAt(tx, ty))){ o.x = tx * TS - o.w; o.vx = 0; hitWall = true; break; } }
  if (o.vx < 0){ const tx = Math.floor(o.x / TS); for (let ty = t0; ty <= t1; ty++) if (isSolid(tileAt(tx, ty))){ o.x = (tx + 1) * TS; o.vx = 0; hitWall = true; break; } }
  const prevBottom = o.y + o.h;
  o.y += o.vy; o.ground = false;
  const l0 = Math.floor(o.x / TS), l1 = Math.floor((o.x + o.w - 1) / TS);
  if (o.vy > 0){
    // 足の裏（y+h）が少しでもタイルに入ったら着地
    const ty = Math.floor((o.y + o.h) / TS);
    for (let tx = l0; tx <= l1; tx++){
      const ch = tileAt(tx, ty);
      if (isSolid(ch) || (oneWay && ch === '=' && prevBottom <= ty * TS + 1)){ o.y = ty * TS - o.h; o.vy = 0; o.ground = true; break; }
    }
  } else if (o.vy < 0){
    const ty = Math.floor(o.y / TS);
    for (let tx = l0; tx <= l1; tx++) if (isSolid(tileAt(tx, ty))){ o.y = (ty + 1) * TS; o.vy = 0; break; }
  }
  return hitWall;
}
function burst(x, y, n, colors, sp = 2.2, up = 1.5){
  for (let i = 0; i < n; i++){ const a = Math.random() * Math.PI * 2, s = Math.random() * sp;
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - up, life: 20 + (Math.random() * 20 | 0), col: colors[(Math.random() * colors.length) | 0], g: .08, size: 1 + (Math.random() < .4 ? 1 : 0)}); }
}
function steam(x, y, n){
  for (let i = 0; i < n; i++) parts.push({x: x + (Math.random() - .5) * 15, y, vx: (Math.random() - .5) * .7, vy: -.6 - Math.random() * .9, life: 30 + (Math.random() * 20 | 0), col: Math.random() < .5 ? '#e8e4d8' : '#b8b4a8', g: -.008, size: 3});
}
function hurtPlayer(fromX){
  if (P.inv > 0) return;
  P.hp--; P.inv = 90; P.vy = -3.9; P.vx = (P.x + P.w / 2 < fromX ? -2.4 : 2.4); P.crouch = false; shake = 6; Sound.hurt();
  burst(P.x + 7, P.y + 15, 10, ['#ffd36a', '#fff']);
  if (P.hp <= 0) gameOver();
}
function gameOver(){ scene = 'over'; Sound.stop(); overT = 0; overSel = 0; }

/* 福丸の今の絵の名前と、描く左上の座標 */
const FP_L = Object.fromEntries(Object.entries(FP).map(([k, r]) => [k, r.map(l => [...l].reverse().join(''))]));
function playerRows(pose){ return P.face > 0 ? FP[pose] : FP_L[pose]; }
function playerPose(){
  if (P.inv > 60) return 'hurt';
  if (P.crouch) return 'crouch';
  if (P.shootT > 0) return 'attack';
  if (!P.ground) return 'run';
  if (Math.abs(P.vx) > .3) return (Math.floor(P.anim) % 2) ? 'run' : 'side';
  return 'side';
}
function playerDrawPos(pose){
  const sh = FK_SHIFT[pose] || 0;
  // 右向きの絵：足元（40ドット目）を当たり判定の下端に、体の中心を判定の中心に
  const x = P.face > 0 ? Math.round(P.x) - 7 - sh : Math.round(P.x) + P.w - 19 + sh;
  return {x, y: Math.round(P.y + P.h) - 40};
}

/* ---------- 更新 ---------- */
function update(){
  frame++;
  if (scene === 'title'){
    titleT++;
    if (pressed.a || pressed.b){ Sound.unlock(); scene = 'select'; selT = 0; selIdx = SAVE.cleared.includes(1) ? 1 : 0; Sound.item(); }
  }
  else if (scene === 'select'){
    selT++;
    if (pressed.left || pressed.right || pressed.down){ selIdx = (selIdx + 1) % STAGES.length; Sound.talk(); }
    stageNo = selIdx + 1;
    if (selT > 10 && pressed.a){
      if (!stageOpen(stageNo)){ Sound.clang(); lockMsgT = 90; }
      else { startGame(false); startTalk(T().intro, () => { scene = 'play'; Sound.bgm(STAGE_BGM()); }); }
    }
    if (lockMsgT > 0) lockMsgT--;
    if (selT > 10 && pressed.b){ scene = 'title'; titleT = 0; stageNo = 1; }
  }
  else if (scene === 'talk'){
    const line = talk.lines[talk.i][1];
    if (pressed.b || skipTap){ skipTap = false; const f = talkNext; talk = null; f(); clearPressed(); return; }
    if (talk.chars < line.length){ talk.chars += .5; if (frame % 4 === 0) Sound.talk(); }
    if (pressed.a){
      if (talk.chars < line.length) talk.chars = line.length;
      else { talk.i++; talk.chars = 0; if (talk.i >= talk.lines.length){ const f = talkNext; talk = null; f(); } }
    }
    updateParts();
  }
  else if (scene === 'play') updatePlay();
  else if (scene === 'over'){
    overT++;
    if (overT > 40){
      if (pressed.left){ overSel = 0; Sound.talk(); }
      if (pressed.right){ overSel = 1; Sound.talk(); }
      if (pressed.a || pressed.b){
        if (overSel === 0){ startGame(bossReached); if (bossReached) enterBoss(true); else { scene = 'play'; Sound.bgm(STAGE_BGM()); } }
        else { scene = 'thanks'; thanksKind = 'quit'; thanksT = 0; }
      }
    }
  }
  else if (scene === 'result'){
    resultT++; updateParts();
    if (resultT > 60 && (pressed.a || pressed.b)){ scene = 'thanks'; thanksKind = 'clear'; thanksT = 0; }
  }
  else if (scene === 'thanks'){
    thanksT++;
    if (thanksT > 60 && (pressed.a || pressed.b)){ scene = 'title'; titleT = 0; stageNo = 1; }
  }
  clearPressed();
}
function clearPressed(){ for (const k in pressed) pressed[k] = false; }

function updatePlay(){
  timer++;
  // --- 福丸 ---
  P.crouch = key.down && P.ground && P.inv <= 60;
  const acc = P.ground ? .42 : .27, max = 2.55;
  if (P.crouch){ P.vx *= .6; if (Math.abs(P.vx) < .05) P.vx = 0; }
  else if (key.left && !key.right){ P.vx = Math.max(P.vx - acc, -max); P.face = -1; }
  else if (key.right && !key.left){ P.vx = Math.min(P.vx + acc, max); P.face = 1; }
  else { P.vx *= P.ground ? .7 : .92; if (Math.abs(P.vx) < .05) P.vx = 0; }
  if (P.ground) P.coyote = 6; else if (P.coyote > 0) P.coyote--;
  if (pressed.a) P.jumpBuf = 6; else if (P.jumpBuf > 0) P.jumpBuf--;
  if (P.jumpBuf > 0 && P.coyote > 0 && !P.crouch){ P.vy = -7.5; P.coyote = 0; P.jumpBuf = 0; Sound.jump(); }
  if (!key.a && P.vy < -2.4) P.vy = -2.4;
  P.vy = Math.min(P.vy + .36, 7.5);
  moveBody(P);
  // ベルトコンベアの上では流される
  if (P.ground){
    const under = tileAt(Math.floor((P.x + P.w / 2) / TS), Math.floor((P.y + P.h + 1) / TS));
    if (under === 'C' || under === 'c'){ const sv = P.vx; P.vx = under === 'C' ? -1.05 : 1.05; P.vy = 0; moveBody(P); P.vx = sv; P.ground = true; }
  }
  if (P.ground && isSolid(tileAt(Math.floor((P.x + 7) / TS), Math.floor((P.y + P.h + 2) / TS))) && P.inv < 60){ P.safeX = P.x; P.safeY = P.y; }
  if (lockCam) P.x = Math.max(BOSS_COL * TS, Math.min(P.x, (COLS - 1) * TS - P.w));
  if (P.y > H + 30){
    P.hp--; shake = 4; Sound.hurt();
    if (P.hp <= 0){ gameOver(); return; }
    P.x = P.safeX; P.y = P.safeY - 6; P.vx = P.vy = 0; P.inv = 90;
  }
  if (P.inv > 0) P.inv--;
  P.anim += Math.abs(P.vx) > .3 && P.ground ? Math.abs(P.vx) * .09 : 0;
  // 湯鉄砲（しゃがみ中は撃てない）
  if (P.cool > 0) P.cool--;
  if (P.shootT > 0) P.shootT--;
  if (pressed.b && P.cool === 0 && shots.length < 3 && !P.crouch && P.inv <= 60){
    P.shootT = 14;
    const d = playerDrawPos('attack');
    const sx = P.face > 0 ? d.x + 23 : d.x + 26 - 23 - 9;
    shots.push({x: sx, y: d.y + 20, w: 9, h: 4, vx: 4.6 * P.face, vy: 0, life: 70});
    P.cool = 14; Sound.shot();
  }
  // --- 弾 ---
  for (const s of shots){
    s.x += s.vx; s.life--;
    if (frame % 3 === 0) parts.push({x: s.x + 4, y: s.y, vx: 0, vy: -.4, life: 14, col: '#f0f0ff', g: -.01});
    const ch = tileAt(Math.floor((s.x + (s.vx > 0 ? 8 : 0)) / TS), Math.floor((s.y + 2) / TS));
    if (isSolid(ch) || s.life <= 0){ s.dead = true; splash(s); }
  }
  // --- 敵 ---
  for (const e of enemies){
    e.anim++;
    if (e.dead){ e.dead++; continue; }
    if (e.flash > 0) e.flash--;
    if (e.type === 'doro' || e.type === 'kara'){
      if (e.still){ e.vy = 0; }
      else if (Math.abs(e.x - P.x) < 450){
        const wall = moveBody(e);
        e.vy = Math.min(e.vy + .3, 6);
        if (e.ground){
          if (e.vx === 0) e.vx = e.dir || (e.type === 'kara' ? -.6 : -.55);
          const ahead = Math.floor((e.x + (e.vx > 0 ? e.w + 1 : -1)) / TS), below = Math.floor((e.y + e.h + 2) / TS);
          const t = tileAt(ahead, below);
          if (wall || !(isSolid(t) || t === '=')) e.vx = -(e.dir || e.vx || -.55);
          e.dir = e.vx;
        }
        if (e.y > H + 60) e.gone = true;
      }
    } else if (e.type === 'onibi' || e.type === 'hebi'){
      const dx = P.x - e.x;
      if (Math.abs(dx) < 180){ e.x += Math.sign(dx) * (e.type === 'hebi' ? .6 : .5); if (dx) e.face = Math.sign(dx); }
      e.y = e.by + Math.sin(e.anim / 20) * (e.type === 'hebi' ? 12 : 15);
    }
    if (overlap(P, e)) hurtPlayer(e.x + e.w / 2);
    // 敵の当たり判定は絵の頭の先まで広げる
    const hb = {x: e.x - 1, y: e.y - 5, w: e.w + 2, h: e.h + 5};
    for (const s of shots) if (!s.dead && overlap(s, hb)){
      s.dead = true; e.hp--; e.flash = 8; Sound.hit(); burst(s.x, s.y, 5, ['#9fd8ff', '#fff']);
      if (e.hp <= 0){
        e.dead = 1; score += (e.type === 'doro' || e.type === 'kara') ? 200 : 300; Sound.kill(); steam(e.x + e.w / 2, e.y + e.h, 12);
        const cols = {doro: ['#84513c', '#bd8040', '#341717'], kara: ['#2a1840', '#5a3c82', '#b07a46', '#f2dcc4'], hebi: ['#2a1840', '#5a3c82', '#0e0818']}[e.type] || ['#7fd8ff', '#e8fbff'];
        burst(e.x + e.w / 2, e.y + e.h / 2, 12, cols);
        if (e.type === 'kara') snakeOut(e.x + e.w / 2, e.y + 4, 6);
      }
    }
  }
  enemies = enemies.filter(e => !(e.dead > 24) && !e.gone);
  // --- 蒸気パイプ ---
  for (const v of vents){
    const t = (frame + v.phase) % VENT_PER;
    const near = Math.abs(v.x - (camX + W / 2)) < 260;
    if (t === VENT_WARN && near) Sound.hiss(.06);
    if (t === VENT_BLAST && near) Sound.hiss(.14);
    if (t >= VENT_WARN && t < VENT_BLAST && frame % 6 === 0) steam(v.x, v.y - 8, 1);
    if (t >= VENT_BLAST){
      if (frame % 2 === 0) for (let k = 0; k < 2; k++) parts.push({x: v.x + (Math.random() - .5) * 12, y: v.y - 8, vx: (Math.random() - .5) * .8, vy: -2.6 - Math.random() * 1.6, life: 26 + (Math.random() * 10 | 0), col: Math.random() < .5 ? '#f4f0e8' : '#c8c4b8', g: .02, size: 3 + (Math.random() < .5 ? 1 : 0)});
      if (overlap(P, {x: v.x - 8, y: v.y - VENT_H, w: 16, h: VENT_H})) hurtPlayer(v.x);
    }
  }
  // --- アイテム ---
  for (const it of items){
    if (!it.got && overlap(P, it)){
      it.got = true;
      if (it.type === 'fuda'){ fudaGot++; score += 100; Sound.item(); burst(it.x + 6, it.y + 9, 8, ['#f2e6c4', '#c8342a']); }
      if (it.type === 'chawan'){ if (P.hp < 3) P.hp++; score += 50; Sound.heal(); steam(it.x + 9, it.y, 10); }
    }
  }
  items = items.filter(i => !i.got);
  // --- ボス ---
  if (!lockCam && P.x > (BOSS_COL + 3) * TS) enterBoss(false);
  if (boss) updateBoss();
  shots = shots.filter(s => !s.dead);
  // --- カメラ（福丸の整数位置にくっつける） ---
  if (lockCam){ camX += (BOSS_COL * TS - camX) * .1; if (Math.abs(BOSS_COL * TS - camX) < .5) camX = BOSS_COL * TS; }
  else {
    lookX += (P.face * 24 - lookX) * .08;
    camX = Math.round(P.x) + 7 - 168 + Math.round(lookX);
    camX = Math.max(0, Math.min(camX, (BOSS_COL - 2) * TS));
  }
  if (shake > 0) shake--;
  updateParts();
}
const VENT_PER = 210, VENT_WARN = 110, VENT_BLAST = 150, VENT_H = 84;
// 黒蛇が抜けて消えていく
function snakeOut(x, y, n){
  for (let i = 0; i < n; i++) parts.push({x: x + (Math.random() - .5) * 10, y, vx: (Math.random() - .5) * 1.6, vy: -1.2 - Math.random() * 1.4, life: 30 + (Math.random() * 20 | 0), col: Math.random() < .5 ? '#2a1840' : '#5a3c82', g: -.01, size: 2});
}
function splash(s){ burst(s.x + 4, s.y + 2, 6, ['#9fd8ff', '#ffffff', '#4bc6eb']); steam(s.x + 4, s.y, 2); Sound.splash(); }
function updateParts(){
  for (const p of parts){ p.vy += p.g; p.x += p.vx; p.y += p.vy; p.life--; }
  parts = parts.filter(p => p.life > 0);
}

/* ---------- ボス：大泥田坊 ----------
   ・頬が膨らむ → 泥つぶてを吐く（しゃがめば頭の上を通り過ぎる）
   ・舌が垂れている間（spitRest）だけ湯鉄砲が効く。ほかの時は泥ではじかれる
   ・近づきすぎると腕を振り下ろしてくる */
function enterBoss(fromRetry){
  lockCam = true; bossReached = true;
  if (fromRetry) camX = BOSS_COL * TS;
  if (stageNo === 2){ enterGenpachi(); return; }
  const gy = 12 * TS;
  enemies = [];   // 道中の敵は連れて来ない

    if (vx < -40 || vx > W + 40) continue;
    const t = (frame + v.phase) % VENT_PER;
    // 蒸気の柱
    if (t >= VENT_BLAST){
      const k = t - VENT_BLAST, hgt = Math.min(VENT_H, k * 8);
      ctx.fillStyle = 'rgba(240,236,228,.55)'; ctx.fillRect(vx - 6 + ((frame >> 1) % 2), v.y - 8 - hgt, 12, hgt);
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(vx - 3, v.y - 8 - hgt, 6, hgt);
    }
    // 口金（予告中は赤く光る）
    const warn = t >= VENT_WARN && t < VENT_BLAST && (frame >> 2) % 2;
    ctx.fillStyle = '#14141a'; ctx.fillRect(vx - 8, v.y - 10, 16, 10);
    ctx.fillStyle = '#6a6e7c'; ctx.fillRect(vx - 7, v.y - 9, 14, 8);
    ctx.fillStyle = '#9aa0b0'; ctx.fillRect(vx - 7, v.y - 9, 14, 2);
    ctx.fillStyle = '#c9a35a'; ctx.fillRect(vx - 8, v.y - 4, 16, 2);
    ctx.fillStyle = warn ? '#ff5a3a' : '#2a2a30'; ctx.fillRect(vx - 4, v.y - 10, 8, 2);
  }
  for (const e of enemies){
    if (e.type === 'kara'){
      const f = (e.anim >> 3) % 2 ? 'kara2' : 'kara1', R = e.vx > 0 ? '_R' : '';
      const img = e.flash > 0 && (e.flash & 2) ? IMG['kara_W' + R] : IMG[f + R];
      if (e.dead){ const sq = Math.min(1, e.dead / 20); ctx.globalAlpha = 1 - sq; ctx.drawImage(img, Math.round(e.x - 2 - cx), Math.round(e.y - 2 + sq * 14), 20, Math.max(1, 26 * (1 - sq))); ctx.globalAlpha = 1; }
      else drawSprite(img, e.x - 2 - cx, e.y - 2);
      continue;
    }
    if (e.type === 'hebi'){
      const f = (e.anim >> 3) % 2 ? 'hebi2' : 'hebi1', R = e.face > 0 ? '_R' : '';
      if (e.dead) ctx.globalAlpha = Math.max(0, 1 - e.dead / 20);
      drawSprite(e.flash > 0 ? IMG.hebi_W : IMG[f + R], e.x - 2 - cx, e.y - 2);
      ctx.globalAlpha = 1;
      continue;
    }
    if (e.type === 'doro'){
      const f = (e.anim >> 4) % 2 ? 'mini2' : 'mini1';
      const img = e.flash > 0 && (e.flash & 2) ? IMG.mini_W : IMG[e.vx > 0 ? f + '_R' : f];
      if (e.dead){ const sq = Math.min(1, e.dead / 20); ctx.globalAlpha = 1 - sq; ctx.drawImage(img, Math.round(e.x - 1 - cx), Math.round(e.y - 2 + sq * 12), 24, Math.max(1, 18 * (1 - sq))); ctx.globalAlpha = 1; }
      else drawSprite(img, e.x - 1 - cx, e.y - 2);
    } else {
      const f = (e.anim >> 3) % 2 ? 'onibi2' : 'onibi1';
      if (e.dead) ctx.globalAlpha = Math.max(0, 1 - e.dead / 20);
      drawSprite(e.flash > 0 ? IMG.onibi1_W : IMG[f], e.x - 1 - cx, e.y - 1);
      ctx.globalAlpha = 1;
    }
  }
  // ボス
  if (boss && boss.kind === 'gen') drawGenpachi(cx);
  else if (boss){
    const b = boss, pose = bossPose();
    const R = b.face > 0 ? '_R' : '', pre = b.big ? 'dbB_' : 'db_';
    // 怒って大きくなる最中は、小さい姿と大きい姿を交互に見せる
    const growing = b.action === 'rage' && b.t < 700 && (frame >> 2) % 2;
    const img = growing ? IMG['db_' + pose + R] : IMG[pre + pose + R];
    const ox = growing ? (b.bw - 96) / 2 : 0, oy = growing ? (Math.round(70 * b.s) - 70) : 0;
    if (b.dead){ ctx.globalAlpha = Math.max(0, 1 - b.dead / 120); const sink = Math.round(b.dead / 6); ctx.drawImage(img, Math.round(b.x) - cx, b.y + sink); ctx.globalAlpha = 1; }
    else drawSprite(b.flash > 0 && (b.flash & 2) ? IMG[pre + 'hurt_W' + R] : img, b.x + ox - cx, b.y + oy);
    // 隙のある時は舌の上に小さく光
    if (!b.dead && pose === 'spitRest' && (frame >> 3) % 2) { ctx.fillStyle = '#fff6c0'; ctx.fillRect(Math.round(b.x + (b.face < 0 ? 14 : 80) * b.s) - cx, Math.round(b.y + 28 * b.s), 2, 2); }
  }
  for (const m of mud) drawSprite(IMG.mud, m.x - cx, m.y);
  // 福丸
  if (!(P.inv > 0 && P.inv <= 60 && (P.inv & 4))){
    const pose = playerPose(), d = playerDrawPos(pose);
    drawSprite(IMG['fk_' + pose + (P.face > 0 ? '' : '_L')], d.x - cx, d.y);
  }
  for (const s of shots) drawSprite(s.vx > 0 ? IMG.water : IMG.water_L, s.x - cx, s.y);
  for (const p of parts){ ctx.fillStyle = p.col; const s = p.size || 1; ctx.fillRect(Math.round(p.x - cx), Math.round(p.y), s, s); }
  for (const p of popups){ drawText(p.t, Math.round(p.x - cx), Math.round(p.y - (40 - p.life) * .4), '#ffe0a0', 12); p.life--; }
  for (let i = popups.length - 1; i >= 0; i--) if (popups[i].life <= 0) popups.splice(i, 1);
  ctx.restore();
}
function drawTitle(){
  drawBG(titleT * .9);
  ctx.fillStyle = 'rgba(8,8,20,.45)'; ctx.fillRect(0, 0, W, H);
  const bob = Math.round(Math.sin(titleT / 15) * 3);
  ctx.drawImage(IMG.fk_front, 166, 168 + bob, 52, 80);
  drawText('神宿りの傀儡 外伝', 192, 40, '#c9a35a', 16, 'center');
  drawText('福丸の術稽古', 192, 66, '#ffd36a', 36, 'center');
  drawText('〜 帝都の妖退治 〜', 192, 116, '#ece3cf', 16, 'center');
  if ((titleT >> 5) % 2 === 0) drawText(isTouch ? '「跳」ボタンで はじめる' : 'Zキーで はじめる', 192, 274, '#fff', 16, 'center');
  drawText('©竜田揚げ', 372, 314, '#8f8672', 12, 'right', false);
}
function drawSelect(){
  // まだ開いていない巻の背景は見せない
  const keep = stageNo; if (!stageOpen(stageNo)) stageNo = 1;
  drawBG(selT * .9); stageNo = keep;
  ctx.fillStyle = 'rgba(8,8,20,.55)'; ctx.fillRect(0, 0, W, H);
  drawText('稽古の巻を えらぶ', 192, 22, '#ffd36a', 22, 'center');
  STAGES.forEach((st, i) => {
    const y = 70 + i * 92, sel = selIdx === i, open = stageOpen(st.no);
    drawWindow(40, y, 304, 76);
    if (sel){ ctx.strokeStyle = (frame >> 3) % 2 ? '#ffd36a' : '#c9a35a'; ctx.lineWidth = 2; ctx.strokeRect(37, y - 3, 310, 82); ctx.lineWidth = 1; }
    drawText(st.kan, 58, y + 14, open ? '#c9a35a' : '#5a5448', 16);
    drawText(open ? st.name : '？？？？？', 58, y + 38, open ? '#f4eee0' : '#5a5448', 20);
    if (SAVE.cleared.includes(st.no)){
      drawText('済', 318, y + 12, '#e0705f', 18, 'right');
      if (SAVE.best[st.no]) drawText('評価：' + SAVE.best[st.no], 326, y + 46, '#8fb4ff', 12, 'right');
    }
    if (!open) drawText('🔒', 318, y + 26, '#8f8672', 20, 'right', false);
    if (sel && (frame >> 4) % 2 === 0) drawText('▶', 22, y + 30, '#ffd36a', 18);
  });
  if (lockMsgT > 0) drawText('壱の巻を クリアすると 遊べるよ', 192, 262, '#e0705f', 16, 'center');
  drawText(isTouch ? '◀▶で選んで「跳」で決定　「湯」でもどる' : '←→で選んで Zで決定　Xでもどる', 192, 296, '#ece3cf', 13, 'center');
}
function drawTalk(){
  const L = talk.lines[talk.i], name = L[0], text = L[1].slice(0, Math.floor(talk.chars));
  drawPortraits();
  drawWindow(9, 228, 366, 100);
  ctx.fillStyle = '#0c1440'; ctx.fillRect(18, 204, 96, 28);
  ctx.strokeStyle = '#c9a35a'; ctx.strokeRect(18.5, 204.5, 95, 27);
  ctx.font = '16px "DotGothic16", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000'; ctx.fillText(name, 67, 219);
  ctx.fillStyle = NAMECOL[name] || '#fff'; ctx.fillText(name, 66, 218);
  wrapJa(text, 20).forEach((l, i) => drawText(l, 24, 246 + i * 22, '#f4eee0'));
  if (talk.chars >= L[1].length && (frame >> 4) % 2) drawText('▼', 352, 306, '#ffd36a', 14);
  ctx.fillStyle = 'rgba(12,20,64,.85)'; ctx.fillRect(276, 34, 98, 22);
  ctx.strokeStyle = '#c9a35a'; ctx.strokeRect(276.5, 34.5, 97, 21);
  drawText(isTouch ? 'スキップ▶▶' : 'X:スキップ', 325, 37, '#ece3cf', 14, 'center');
}
function drawOver(){
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(IMG.fk_hurt, 166, 24, 52, 80);
  drawText('やられてしもうた……', 192, 122, '#ffd36a', 24, 'center');
  drawText(bossReached ? STG().boss + 'の前から やり直す' : 'はじめから やり直す', 192, 166, '#ece3cf', 16, 'center');
  if (overT > 40){
    ['もう一度', 'やめる'].forEach((t, i) => {
      const x = i === 0 ? 126 : 258, sel = overSel === i;
      drawText(t, x, 214, sel ? '#ffd36a' : '#8f8672', 18, 'center');
      if (sel && (frame >> 4) % 2 === 0) drawText('▶', x - 52, 214, '#ffd36a', 18);
    });
    drawText(isTouch ? '◀▶で選んで「跳」で決定' : '←→で選んで Zキーで決定', 192, 258, '#ece3cf', 14, 'center');
  }
}
const THANKS = {
  quit:  ['遊んでくれてありがとう！', 'また来てね！'],
  clear: ['おめでとう！', '今日はきっと', '良いことがあるよ！', 'スマイルスマイル！'],
};
function drawThanks(){
  drawBG(frame * .45);
  ctx.fillStyle = 'rgba(8,8,20,.6)'; ctx.fillRect(0, 0, W, H);
  const lines = THANKS[thanksKind], clr = thanksKind === 'clear', top = clr ? 44 : 84, sp = 28;
  drawWindow(36, top - 20, 312, lines.length * sp + 70);
  lines.forEach((l, i) => drawText(l, 192, top + i * sp, i === 0 ? '#ffd36a' : '#f4eee0', 20, 'center'));
  drawText('竜田揚げ', 324, top + lines.length * sp + 14, '#c9a35a', 16, 'right');
  const bow = clr ? Math.round(Math.sin(frame / 10) * 3) : ((frame >> 5) % 2) * 4;
  ctx.drawImage(IMG[clr ? 'fk_run' : 'fk_front'], 166, 222 + bow, 52, 80);
  if (thanksT > 60 && (frame >> 5) % 2 === 0) drawText(isTouch ? '「跳」でタイトルへ' : 'Zキーでタイトルへ', 192, 310, '#fff', 14, 'center');
}
function drawResult(){
  drawBG(timer * .3);
  ctx.fillStyle = 'rgba(8,8,20,.55)'; ctx.fillRect(0, 0, W, H);
  drawText(STG().kan + ' 稽古 完了！', 192, 30, '#ffd36a', 30, 'center');
  drawWindow(54, 96, 276, 138);
  const sec = Math.floor(timer / 60), t = `${Math.floor(sec / 60)}分${String(sec % 60).padStart(2, '0')}秒`;
  drawText('かかった時間', 74, 118); drawText(t, 310, 118, '#fff', 16, 'right');
  drawText('集めた札', 74, 148); drawText(`${fudaGot} / ${fudaTotal}`, 310, 148, '#fff', 16, 'right');
  drawText('得点', 74, 178); drawText(String(score), 310, 178, '#ffd36a', 16, 'right');
  drawText('評価：' + rankOf(), 192, 244, '#8fb4ff', 18, 'center');
  if (newlyOpened && (frame >> 4) % 4 !== 0) drawText(STAGES[stageNo].kan + '『' + STAGES[stageNo].name + '』が ひらいた！', 192, 270, '#ffd36a', 14, 'center');
  ctx.drawImage(IMG.fk_attack, 26, 246, 52, 80);
  if (resultT > 60 && (frame >> 5) % 2 === 0) drawText(isTouch ? '「跳」で つぎへ' : 'Zキーで つぎへ', 192, 296, '#fff', 16, 'center');
}
function draw(){
  ctx.imageSmoothingEnabled = false;
  if (scene === 'loading'){ ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); drawText('よみこみ中…', 192, 156, '#ece3cf', 16, 'center', false); return; }
  if (scene === 'title'){ drawTitle(); return; }
  if (scene === 'select'){ drawSelect(); return; }
  if (scene === 'result'){ drawResult(); return; }
  if (scene === 'thanks'){ drawThanks(); return; }
  drawWorld(); drawHUD();
  if (scene === 'talk') drawTalk();
  if (scene === 'over') drawOver();
}

/* ---------- ループ ---------- */
let last = 0, accT = 0;
function loop(t){
  if (!last) last = t;
  accT += Math.min(100, t - last); last = t;
  requestAnimationFrame(loop);
  try {
    while (accT >= FRAME_MS){ update(); accT -= FRAME_MS; }
    draw();
  } catch (e){ accT = 0; console.error(e); }
}
// 自動テスト用
window.__game = {get scene(){ return scene; }, get P(){ return P; }, get boss(){ return boss; }, key, pressed, setKey,
  get score(){ return score; }, get fuda(){ return fudaGot; }, get camX(){ return camX; }, get mud(){ return mud; },
  solid: (x, y) => isSolid(tileAt(x, y)), plank: (x, y) => tileAt(x, y) === '=', TS,
  get enemies(){ return enemies; }, clearEnemies(){ enemies.length = 0; }, spawnDoro(px){ spawnEnemy({type: 'doro', x: px}); const e = enemies[enemies.length - 1]; e.vx = 0; e.dir = 0; e.still = true; return e; },
  get stage(){ return stageNo; }, setStage(n){ stageNo = n; }, unlockAll(){ SAVE.cleared = [1, 2]; saveNow(); }, get vents(){ return vents; },
  warp(x, y = 9){ P.x = x * TS; P.y = y * TS; P.vy = 0; camX = Math.max(0, P.x - 150); }};

fit();
Promise.race([document.fonts.load('16px "DotGothic16"'), new Promise(r => setTimeout(r, 2500))]).finally(() => {
  scene = 'title'; fit(); requestAnimationFrame(loop);
});
requestAnimationFrame(() => draw());
</script>
